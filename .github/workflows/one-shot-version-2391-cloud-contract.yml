name: One-shot migrate 2.3.9.1 cloud contract

on:
  push:
    branches:
      - feature/phase23-slice-d-diagnostic-snapshot-release
    paths:
      - .github/workflows/one-shot-version-2391-cloud-contract.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/phase23-slice-d-diagnostic-snapshot-release
          fetch-depth: 0

      - name: Synchronize current release contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version_paths = (
              "contracts/release/project-goal-invariants.json",
              "tests/contract/test_phase23_mac_delta_source.py",
              "tests/contract/test_product_version_goal_integrity.py",
              "tests/contract/test_project_goal_integrity.py",
              "tests/contract/test_results_center_2371_contract.py",
              "tests/contract/test_windows_executable_allowlist.py",
              "tests/contract/test_windows_goal_integrity_stamper.py",
              "tests/contract/test_windows_product_version_surfaces.py",
              "tests/integration/api/test_product_version_api.py",
              "tests/release/test_windows_goal_integrity_release_contract.py",
              "tests/test_package_baseline.py",
              "tests/unit/test_product_version.py",
              "windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/ProductVersionWpfSmokeTests.cs",
              "windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/ResultsCenterSmokeTests.cs",
              "windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/ResultsPageWpfLayoutSmokeTests.cs",
          )
          for name in version_paths:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "2.3.8.1" not in text:
                  raise SystemExit(f"missing expected 2.3.8.1 reference in {name}")
              path.write_text(text.replace("2.3.8.1", "2.3.9.1"), encoding="utf-8")

          parser_test = Path("tests/unit/test_product_version.py")
          text = parser_test.read_text(encoding="utf-8")
          if '"2.3.8"' not in text:
              raise SystemExit("missing invalid three-part version fixture")
          parser_test.write_text(text.replace('"2.3.8"', '"2.3.9"'), encoding="utf-8")

          release_replacements = {
              ".github/workflows/windows-phase2-release.yml": (
                  ("2.3.0-slice-d-approval", "2.3.0-slice-d-cloud-contract"),
                  ("PicotooPet-Phase23-Approval-Windows-Prebuilt", "PicotooPet-Phase23-CloudContract-Windows-Prebuilt"),
              ),
              "tests/contract/test_phase23_windows_source.py": (
                  ("PicotooPet-Phase23-Approval-Windows-Prebuilt", "PicotooPet-Phase23-CloudContract-Windows-Prebuilt"),
              ),
              "tests/release/test_windows_prebuilt_delivery.py": (
                  ("2.3.0-slice-d-approval", "2.3.0-slice-d-cloud-contract"),
                  ("PicotooPet-Phase23-Approval-Windows-Prebuilt", "PicotooPet-Phase23-CloudContract-Windows-Prebuilt"),
              ),
          }
          for name, replacements in release_replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"missing release label {old!r} in {name}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          navigation = Path(
              "windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/NavigationSmokeTests.cs"
          )
          text = navigation.read_text(encoding="utf-8")
          old = '''        SmokeAssert.True(
              !shell.NavigationItems
                  .Single(item => item.Route == NavigationRoute.CloudDevelopment)
                  .IsAvailable,
              "未实现云端开发不得可操作");
          '''.replace("              ", "")
          new = '''        SmokeAssert.True(
              shell.NavigationItems
                  .Single(item => item.Route == NavigationRoute.CloudDevelopment)
                  .IsAvailable,
              "冻结合同状态页必须可打开");
          '''.replace("              ", "")
          if old not in text:
              raise SystemExit("old CloudDevelopment availability assertion not found")
          text = text.replace(old, new, 1)

          old_page = '''        shell.Navigate(NavigationRoute.CloudDevelopment);
              var page = shell.CurrentPage as EmptyStatePageViewModel;
              SmokeAssert.True(page is not null, "云端开发必须显示解释性空状态");
              SmokeAssert.True(page!.Title == "云端开发", "云端开发标题被改写");
              SmokeAssert.True(
                  page.Reason == "当前版本只冻结了 Handoff / Return Contract，尚未安装或调用外部 Provider。",
                  "云端开发原因说明被改写");
              SmokeAssert.True(
                  page.NextStep == "Phase 10A 将先加入包预览和审批；Phase 10B 才加入 Dev Broker。",
                  "云端开发后续步骤被改写");
              SmokeAssert.True(page.UserAction == "你现在不需要操作。", "用户动作说明被改写");
          '''.replace("              ", "")
          new_page = '''        shell.Navigate(NavigationRoute.CloudDevelopment);
              var page = shell.CurrentPage as CloudDevelopmentPageViewModel;
              SmokeAssert.True(page is not null, "云端开发必须显示冻结合同状态页");
              SmokeAssert.True(page!.Title == "云端开发", "云端开发标题被改写");
              SmokeAssert.True(page.ContractVersion == "1.0.0", "云端开发合同版本错误");
              SmokeAssert.True(!page.ProviderConfigured, "云端开发不得伪造 Provider 已配置");
          '''.replace("              ", "")
          if old_page not in text:
              raise SystemExit("old CloudDevelopment empty-state block not found")
          navigation.write_text(text.replace(old_page, new_page, 1), encoding="utf-8")

          suppressions = Path("windows/desktop/src/PicotooPet.Desktop/GlobalSuppressions.cs")
          text = suppressions.read_text(encoding="utf-8")
          targets = (
              "ContractVersion",
              "ContractStatus",
              "ProviderConfigured",
              "ProviderStatus",
              "CurrentDelivery",
              "TrustChain",
              "SecurityBoundaries",
              "PhaseMilestones",
          )
          additions = []
          for property_name in targets:
              target = (
                  "~P:PicotooPet.Desktop.ViewModels."
                  f"CloudDevelopmentPageViewModel.{property_name}"
              )
              if target in text:
                  continue
              additions.append(
                  "\n[assembly: SuppressMessage(\n"
                  "    \"Performance\",\n"
                  "    \"CA1822:Mark members as static\",\n"
                  "    Justification = \"WPF binds this read-only contract property through the page DataContext instance.\",\n"
                  "    Scope = \"member\",\n"
                  f"    Target = \"{target}\")]\n"
              )
          suppressions.write_text(text + "".join(additions), encoding="utf-8")

          allowed_old_version = {
              "src/picotoopet_core/product-version.txt",
              "docs/superpowers/plans/2026-08-05-cloud-development-contract-status-page.md",
              ".github/workflows/one-shot-version-2391-cloud-contract.yml",
              ".github/workflows/one-shot-audit-version-2381.yml",
          }
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if "2.3.8.1" in content and path.as_posix() not in allowed_old_version:
                  raise SystemExit(f"unexpected remaining 2.3.8.1 in {path}")
              if "slice-d-approval" in content or "Phase23-Approval" in content:
                  if path.as_posix() not in {
                      ".github/workflows/one-shot-version-2391-cloud-contract.yml",
                      ".github/workflows/one-shot-audit-version-2381.yml",
                  }:
                      raise SystemExit(f"unexpected old release label in {path}")
          PY

      - name: Commit migration and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/one-shot-audit-version-2381.yml
          rm .github/workflows/one-shot-version-2391-cloud-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: align 2.3.9.1 cloud-contract milestone"
          git push origin HEAD:feature/phase23-slice-d-diagnostic-snapshot-release
