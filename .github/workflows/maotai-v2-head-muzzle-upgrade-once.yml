name: Maotai v2 Head Muzzle Upgrade Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-head-muzzle-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Render furry neutral head shell and muzzle
        shell: python
        run: |
          from __future__ import annotations

          import math
          import struct
          import zlib
          from pathlib import Path

          ASSET_DIR = Path("windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2")

          def clamp01(value: float) -> float:
              return max(0.0, min(1.0, value))

          def smoothstep(edge0: float, edge1: float, value: float) -> float:
              if edge0 == edge1:
                  return 1.0 if value >= edge1 else 0.0
              t = clamp01((value - edge0) / (edge1 - edge0))
              return t * t * (3.0 - 2.0 * t)

          def hash_noise(x: int, y: int, seed: int) -> float:
              value = (x * 374761393 + y * 668265263 + seed * 69069) & 0xFFFFFFFF
              value = ((value ^ (value >> 13)) * 1274126177) & 0xFFFFFFFF
              value ^= value >> 16
              return value / 4294967295.0

          def blend(a: tuple[float, float, float], b: tuple[float, float, float], t: float) -> tuple[float, float, float]:
              t = clamp01(t)
              return tuple(a[i] * (1.0 - t) + b[i] * t for i in range(3))

          def png_bytes(width: int, height: int, pixels: bytes) -> bytes:
              raw = bytearray()
              stride = width * 4
              for row in range(height):
                  raw.append(0)
                  start = row * stride
                  raw.extend(pixels[start:start + stride])

              def chunk(kind: bytes, payload: bytes) -> bytes:
                  return (
                      struct.pack(">I", len(payload))
                      + kind
                      + payload
                      + struct.pack(">I", zlib.crc32(kind + payload) & 0xFFFFFFFF)
                  )

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )

          def render_head(width: int = 156, height: int = 140) -> bytes:
              pixels = bytearray(width * height * 4)
              dark_base   = (48.0, 42.0, 57.0)
              dark_light  = (78.0, 67.0, 82.0)
              cream_base  = (232.0, 223.0, 221.0)
              cream_light = (250.0, 244.0, 239.0)

              for y in range(height):
                  ny = ((y + 0.5) / height) * 2.0 - 1.0
                  for x in range(width):
                      nx = ((x + 0.5) / width) * 2.0 - 1.0

                      # Coat noise        : three deterministic scales break both the silhouette and the flat-fill look.
                      n1 = hash_noise(x, y, 3101)
                      n2 = hash_noise(x // 3, y // 3, 3137)
                      n3 = hash_noise(x // 7, y // 6, 3191)
                      noise = 0.52 * n1 + 0.30 * n2 + 0.18 * n3

                      # Head silhouette   : broad cheeks, slightly narrower crown, and a soft furry boundary.
                      cheek_expand = smoothstep(-0.05, 0.88, ny) * 0.14
                      rx = 0.78 + cheek_expand
                      ry = 0.74
                      ellipse = ((nx / rx) ** 2) + (((ny + 0.01) / ry) ** 2)
                      furry_limit = 1.0 + ((noise - 0.5) * 0.10)
                      alpha = 1.0 - smoothstep(furry_limit - 0.08, furry_limit + 0.05, ellipse)

                      # Crown taper       : independent ears own the upper corners, so the shell stays rounded between them.
                      crown_cut = smoothstep(-0.97, -0.70, ny)
                      side_cut = 1.0 - smoothstep(0.46, 0.86, abs(nx))
                      alpha *= max(crown_cut, side_cut)

                      # Malamute mask     : white cheeks plus a tapered center blaze; no baked eyes or mouth.
                      cheek_white = smoothstep(-0.10, 0.72, ny) * (1.0 - smoothstep(0.56, 0.94, abs(nx)))
                      blaze_width = 0.10 + (0.08 * smoothstep(-0.86, 0.20, ny))
                      blaze = math.exp(-((nx / blaze_width) ** 2) * 2.4) * (1.0 - smoothstep(0.18, 0.76, ny))
                      white_mix = clamp01(max(cheek_white, blaze))

                      # Lighting          : brighter lower-center fur and subtle warm rim light keep the head 2.5D.
                      light = clamp01(0.55 + (0.25 * (1.0 - ny)) + ((noise - 0.5) * 0.22))
                      dark = blend(dark_base, dark_light, light)
                      cream = blend(cream_base, cream_light, light)
                      color = blend(dark, cream, white_mix)

                      rim = smoothstep(0.54, 0.95, abs(nx)) * (1.0 - smoothstep(0.45, 0.90, ny)) * 9.0
                      color = tuple(min(255.0, channel + rim) for channel in color)

                      offset = (y * width + x) * 4
                      pixels[offset + 0] = int(round(color[0]))
                      pixels[offset + 1] = int(round(color[1]))
                      pixels[offset + 2] = int(round(color[2]))
                      pixels[offset + 3] = int(round(clamp01(alpha) * 255.0))

              return png_bytes(width, height, bytes(pixels))

          def render_muzzle(width: int = 92, height: int = 68) -> bytes:
              pixels = bytearray(width * height * 4)
              cream_base  = (235.0, 225.0, 221.0)
              cream_light = (253.0, 246.0, 241.0)

              for y in range(height):
                  ny = ((y + 0.5) / height) * 2.0 - 1.0
                  for x in range(width):
                      nx = ((x + 0.5) / width) * 2.0 - 1.0

                      n1 = hash_noise(x, y, 4103)
                      n2 = hash_noise(x // 3, y // 3, 4127)
                      noise = 0.70 * n1 + 0.30 * n2

                      # Muzzle silhouette : two overlapping cheek lobes with a shallow lower taper.
                      left  = (((nx + 0.28) / 0.68) ** 2) + (((ny + 0.03) / 0.58) ** 2)
                      right = (((nx - 0.28) / 0.68) ** 2) + (((ny + 0.03) / 0.58) ** 2)
                      shape = min(left, right)
                      furry_limit = 1.0 + ((noise - 0.5) * 0.08)
                      alpha = 1.0 - smoothstep(furry_limit - 0.10, furry_limit + 0.06, shape)
                      alpha *= 1.0 - smoothstep(0.72, 1.02, ny)

                      light = clamp01(0.58 + ((1.0 - ny) * 0.20) + ((noise - 0.5) * 0.18))
                      color = blend(cream_base, cream_light, light)

                      # Nose               : a shaded rounded triangular pad; mouth remains entirely independent.
                      nose_y = ny + 0.34
                      nose_width = 0.26 - (0.10 * max(0.0, nose_y))
                      nose_shape = abs(nx) / max(0.12, nose_width) + abs(nose_y) / 0.23
                      nose_alpha = 1.0 - smoothstep(0.72, 1.05, nose_shape)
                      if nose_alpha > 0.0:
                          highlight = clamp01(0.35 + ((-nx - ny) * 0.18))
                          nose = blend((22.0, 19.0, 24.0), (71.0, 62.0, 72.0), highlight)
                          color = blend(color, nose, nose_alpha)
                          alpha = max(alpha, nose_alpha)

                      offset = (y * width + x) * 4
                      pixels[offset + 0] = int(round(color[0]))
                      pixels[offset + 1] = int(round(color[1]))
                      pixels[offset + 2] = int(round(color[2]))
                      pixels[offset + 3] = int(round(clamp01(alpha) * 255.0))

              return png_bytes(width, height, bytes(pixels))

          head = render_head()
          muzzle = render_muzzle()
          (ASSET_DIR / "head.png").write_bytes(head)
          (ASSET_DIR / "muzzle.png").write_bytes(muzzle)
          print(f"MAOTAI_V2_HEAD=FURRY_NEUTRAL:{len(head)}")
          print(f"MAOTAI_V2_MUZZLE=FURRY_NEUTRAL:{len(muzzle)}")

      - name: Commit focused head and muzzle upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/head.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/muzzle.png
          git diff --cached --check
          git commit -m "fix(maotai-v2): rebuild head shell and muzzle materials"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
