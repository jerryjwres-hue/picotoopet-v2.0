name: One-shot fix 2.3.15.1 import order

on:
  push:
    branches:
      - feature/phase10d-local-commit-candidate-2.3.15.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/phase10d-local-commit-candidate-2.3.15.1
          fetch-depth: 0

      - name: Apply Ruff import ordering
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/picotoopet_core/providers/commit_execution.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "from __future__ import annotations\n\nfrom contextlib import suppress\n\nimport ast\nimport hashlib\nimport json\nimport os\nimport subprocess\nimport tempfile\nfrom dataclasses import dataclass",
              "from __future__ import annotations\n\nimport ast\nimport hashlib\nimport json\nimport os\nimport subprocess\nimport tempfile\nfrom contextlib import suppress\nfrom dataclasses import dataclass",
              1,
          )
          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/one-shot-fix-23151-import-order.yml").unlink()

      - name: Commit atomic lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize commit execution imports"
          git push origin HEAD:feature/phase10d-local-commit-candidate-2.3.15.1
