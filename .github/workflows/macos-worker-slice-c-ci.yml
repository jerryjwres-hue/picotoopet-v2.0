name: Mac Worker Slice D CI

on:
  pull_request:
    paths:
      - ".github/workflows/macos-worker-slice-c-ci.yml"
      - "scripts/detect_component_impact.py"
      - "contracts/release/component-baselines.json"
      - "src/**"
      - "tests/**"
      - "scripts/mac/phase23-worker/**"
      - "deploy/macos/phase23-worker/**"
      - "deploy/macos/phase23/lib.sh"
      - "contracts/release/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      runner_target:
        description: "Native Apple Silicon runner label"
        required: true
        default: picotoopet-macos-arm64-release
        type: choice
        options:
          - picotoopet-macos-arm64-release
          - macos-15

permissions:
  contents: read

concurrency:
  group: mac-worker-slice-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Detect Worker impact
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      worker: ${{ steps.detect.outputs.worker }}
    steps:
      - name: Check out source and verified baselines
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify affected components
        id: detect
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/detect_component_impact.py \
              --baselines contracts/release/component-baselines.json \
              --head "$HEAD_SHA" \
              --force worker \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/detect_component_impact.py \
              --baselines contracts/release/component-baselines.json \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped native work
        if: steps.detect.outputs.worker != 'true'
        shell: bash
        run: echo "Worker runtime and packaging are unchanged since the verified Worker baseline; native macOS build and Artifact are intentionally skipped."

  native-m4-worker-delivery:
    needs: impact
    if: needs.impact.outputs.worker == 'true'
    name: Native M4/arm64 Slice D Worker delivery
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target || 'macos-15' }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PICOTOOPET_CODEX_EXECUTABLE: "${{ github.workspace }}/tests/fixtures/codex/fake_codex_jsonl.py"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pinned test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . \
            pytest==9.1.1 \
            pytest-asyncio==1.4.0 \
            pytest-cov==7.1.0 \
            ruff==0.16.1 \
            jsonschema==4.26.0
          chmod +x "$PICOTOOPET_CODEX_EXECUTABLE"

      - name: Verify native M4-class environment
        shell: bash
        run: |
          sw_vers
          uname -m
          python --version
          test "$(uname -m)" = "arm64"
          test "$(python -c 'import platform; print(platform.machine())')" = "arm64"

      - name: Run Slice D Worker and delivery contracts
        shell: bash
        run: |
          PYTHONPATH=.:src python -m pytest -q \
            tests/contract/test_install_regression_registry.py \
            tests/contract/test_worker_runtime_source.py \
            tests/contract/test_phase23_worker_delivery.py \
            tests/contract/test_phase23_worker_status_contract.py \
            tests/contract/test_phase23_diagnostic_contract.py \
            tests/contract/test_phase10d_codex_provider_contract.py \
            tests/contract/test_phase10d_codex_worker_contract.py \
            tests/integration/api/test_diagnostic_snapshot_api.py \
            tests/integration/queue/test_diagnostic_cancellation.py \
            tests/integration/queue/test_diagnostic_result_commit.py \
            tests/integration/queue/test_worker_leases.py \
            tests/integration/worker/test_diagnostic_worker_e2e.py \
            tests/unit/diagnostics/test_diagnostic_collector.py \
            tests/unit/diagnostics/test_diagnostic_models.py \
            tests/unit/diagnostics/test_diagnostic_result_store.py \
            tests/unit/diagnostics/test_diagnostic_subprocess.py \
            tests/unit/worker/test_worker_runtime_foundation.py

      - name: Run full Python regression
        shell: bash
        run: |
          PYTHONPATH=.:src python -m pytest -q

      - name: Lint Slice D Worker and delivery changes
        shell: bash
        run: |
          ruff check \
            src/picotoopet_core/diagnostics \
            src/picotoopet_core/providers \
            src/picotoopet_core/results \
            src/picotoopet_core/worker \
            src/picotoopet_core/queue/diagnostic_repository.py \
            src/picotoopet_core/api/contracts/control_center.py \
            src/picotoopet_core/api/routes/provider_sessions.py \
            src/picotoopet_core/api/routes/tasks.py \
            src/picotoopet_core/api/routes/workers.py \
            src/picotoopet_core/config \
            src/picotoopet_core/cli.py \
            tests/contract/test_install_regression_registry.py \
            tests/contract/test_worker_runtime_source.py \
            tests/contract/test_phase23_worker_delivery.py \
            tests/contract/test_phase23_diagnostic_contract.py \
            tests/contract/test_phase10d_codex_provider_contract.py \
            tests/contract/test_phase10d_codex_worker_contract.py \
            tests/fixtures/codex/fake_codex_jsonl.py \
            tests/integration/api/test_diagnostic_snapshot_api.py \
            tests/integration/queue/test_diagnostic_cancellation.py \
            tests/integration/queue/test_diagnostic_result_commit.py \
            tests/integration/worker/test_diagnostic_worker_e2e.py \
            tests/unit/diagnostics \
            tests/unit/worker/test_worker_runtime_foundation.py
          ruff check --ignore I001 src/picotoopet_core/queue/repository.py

      - name: Validate all Slice D shell syntax on macOS Bash
        shell: bash
        run: |
          for script in \
            scripts/mac/phase23-worker/*.sh \
            deploy/macos/phase23-worker/*.command \
            deploy/macos/phase23-worker/*.sh \
            deploy/macos/phase23/lib.sh; do
            bash -n "$script"
          done

      - name: Build M4 arm64 offline Slice D Worker package
        shell: bash
        run: |
          output="artifacts/mac-worker-slice-d/arm64"
          mkdir -p "$output"
          bash scripts/mac/phase23-worker/Build-MacWorkerSliceC.sh \
            --output-root "$output" \
            --version-label "2.3.0-slice-d-worker-${{ github.run_number }}-${{ github.sha }}"

      - name: Verify actual Slice D Worker archive and manifest
        shell: bash
        run: |
          bash scripts/mac/phase23-worker/Test-MacWorkerSliceC.sh \
            "artifacts/mac-worker-slice-d/arm64"

      - name: Exercise diagnostic cancellation timeout recovery and rollback
        shell: bash
        run: |
          bash scripts/mac/phase23-worker/Test-MacWorkerSliceCFixture.sh \
            "artifacts/mac-worker-slice-d/arm64"

      - name: Upload failed-run Worker diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-MacWorker-SliceD-DIAGNOSTIC-arm64-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/mac-worker-slice-d/arm64/*.tar.gz
            artifacts/mac-worker-slice-d/arm64/*.sha256.txt
            artifacts/mac-worker-slice-d/arm64/mac-worker-build-report.json
            artifacts/mac-worker-slice-d/arm64/fixture-evidence/*.json
            artifacts/mac-worker-slice-d/arm64/fixture-evidence/*.txt

      - name: Upload verified M4 Slice D Worker candidate
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-MacWorker-SliceD-arm64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/mac-worker-slice-d/arm64/*.tar.gz
            artifacts/mac-worker-slice-d/arm64/*.sha256.txt
            artifacts/mac-worker-slice-d/arm64/mac-worker-build-report.json
            artifacts/mac-worker-slice-d/arm64/fixture-evidence/*.json
            artifacts/mac-worker-slice-d/arm64/fixture-evidence/*.txt
