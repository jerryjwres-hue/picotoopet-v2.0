name: Maotai v2 Limb Shape Upgrade Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-limb-shape-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Render shorter tapered furry limb silhouettes
        shell: python
        run: |
          from __future__ import annotations

          import math
          import struct
          import zlib
          from pathlib import Path

          ASSET_DIR = Path("windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2")
          TARGETS = {
              "front_left_upper.png":  (68, 92, "front_upper", False),
              "front_right_upper.png": (68, 92, "front_upper", True),
              "front_left_lower.png":  (64, 88, "front_lower", False),
              "front_right_lower.png": (64, 88, "front_lower", True),
              "hind_left_upper.png":   (76, 88, "hind_upper", False),
              "hind_right_upper.png":  (76, 88, "hind_upper", True),
              "hind_left_lower.png":   (72, 84, "hind_lower", False),
              "hind_right_lower.png":  (72, 84, "hind_lower", True),
          }

          def clamp01(value: float) -> float:
              return max(0.0, min(1.0, value))

          def smoothstep(edge0: float, edge1: float, value: float) -> float:
              if edge0 == edge1:
                  return 1.0 if value >= edge1 else 0.0
              t = clamp01((value - edge0) / (edge1 - edge0))
              return t * t * (3.0 - 2.0 * t)

          def hash_noise(x: int, y: int, seed: int) -> float:
              value = (x * 374761393 + y * 668265263 + seed * 69069) & 0xFFFFFFFF
              value = ((value ^ (value >> 13)) * 1274126177) & 0xFFFFFFFF
              value ^= value >> 16
              return value / 4294967295.0

          def blend(a: tuple[float, float, float], b: tuple[float, float, float], t: float) -> tuple[float, float, float]:
              t = clamp01(t)
              return tuple(a[i] * (1.0 - t) + b[i] * t for i in range(3))

          def png_bytes(width: int, height: int, pixels: bytes) -> bytes:
              raw = bytearray()
              stride = width * 4
              for row in range(height):
                  raw.append(0)
                  start = row * stride
                  raw.extend(pixels[start:start + stride])

              def chunk(kind: bytes, payload: bytes) -> bytes:
                  return (
                      struct.pack(">I", len(payload))
                      + kind
                      + payload
                      + struct.pack(">I", zlib.crc32(kind + payload) & 0xFFFFFFFF)
                  )

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )

          def silhouette(nx: float, ny: float, kind: str, mirror: bool, noise: float) -> float:
              x = -nx if mirror else nx

              if kind == "front_upper":
                  center = -0.05 + (0.10 * math.sin((ny + 0.20) * 2.0))
                  width = 0.46 - (0.10 * smoothstep(-0.15, 0.55, ny)) + (0.05 * smoothstep(0.20, 0.65, ny))
                  top0, top1 = -0.82, -0.64
                  bot0, bot1 = 0.48, 0.72
              elif kind == "front_lower":
                  center = 0.02 + (0.13 * math.sin((ny + 0.18) * 1.8))
                  width = 0.38 - (0.07 * smoothstep(-0.25, 0.20, ny)) + (0.10 * smoothstep(0.20, 0.62, ny))
                  top0, top1 = -0.82, -0.60
                  bot0, bot1 = 0.46, 0.72
              elif kind == "hind_upper":
                  center = -0.02 + (0.12 * math.sin((ny + 0.10) * 1.7))
                  width = 0.50 - (0.12 * smoothstep(-0.05, 0.55, ny)) + (0.04 * smoothstep(0.22, 0.62, ny))
                  top0, top1 = -0.84, -0.64
                  bot0, bot1 = 0.46, 0.72
              else:
                  center = 0.03 + (0.15 * math.sin((ny + 0.22) * 1.7))
                  width = 0.42 - (0.08 * smoothstep(-0.25, 0.18, ny)) + (0.12 * smoothstep(0.18, 0.62, ny))
                  top0, top1 = -0.82, -0.60
                  bot0, bot1 = 0.44, 0.72

              # Furry side edge   : a narrow noisy boundary avoids the old paper-strip silhouette.
              edge = abs(x - center) - width
              edge_width = 0.028 + (0.045 * noise)
              side = 1.0 - smoothstep(-edge_width, edge_width, edge)

              # Joint overlap     : both ends stay soft and visible around the manifest pivot instead of ending in a hard line.
              top = smoothstep(top0 + ((noise - 0.5) * 0.07), top1, ny)
              bottom = 1.0 - smoothstep(bot0, bot1 + ((noise - 0.5) * 0.07), ny)
              return clamp01(side * top * bottom)

          def coat_color(nx: float, ny: float, kind: str, noise: float) -> tuple[int, int, int]:
              dark  = (53.0, 48.0, 60.0)
              mid   = (83.0, 74.0, 84.0)
              cream = (239.0, 229.0, 224.0)

              lower = kind.endswith("lower")
              if lower:
                  cream_mix = smoothstep(-0.10, 0.58, ny)
                  base = blend(mid, cream, cream_mix)
              else:
                  mid_mix = smoothstep(0.05, 0.62, ny)
                  base = blend(dark, mid, mid_mix)

              # Fur lighting      : center sheen plus multi-scale grain gives the limb volume without baked outlines.
              sheen = clamp01(1.0 - abs(nx + 0.16)) * 10.0
              grain = (noise - 0.5) * 18.0
              return tuple(max(0, min(255, int(round(channel + sheen + grain)))) for channel in base)

          def render(width: int, height: int, kind: str, mirror: bool, seed: int) -> bytes:
              pixels = bytearray(width * height * 4)
              for y in range(height):
                  ny = ((y + 0.5) / height) * 2.0 - 1.0
                  for x in range(width):
                      nx = ((x + 0.5) / width) * 2.0 - 1.0

                      n1 = hash_noise(x, y, seed)
                      n2 = hash_noise(x // 3, y // 3, seed + 31)
                      n3 = hash_noise(x // 7, y // 6, seed + 71)
                      noise = (0.50 * n1) + (0.32 * n2) + (0.18 * n3)

                      alpha = silhouette(nx, ny, kind, mirror, noise)
                      color = coat_color(-nx if mirror else nx, ny, kind, noise)

                      offset = (y * width + x) * 4
                      pixels[offset + 0] = color[0]
                      pixels[offset + 1] = color[1]
                      pixels[offset + 2] = color[2]
                      pixels[offset + 3] = int(round(alpha * 255.0))

              return png_bytes(width, height, bytes(pixels))

          for index, (name, (width, height, kind, mirror)) in enumerate(TARGETS.items(), start=1):
              payload = render(width, height, kind, mirror, 5200 + (index * 101))
              (ASSET_DIR / name).write_bytes(payload)
              print(f"MAOTAI_V2_LIMB={name}:{width}x{height}:{len(payload)}")

      - name: Commit focused limb silhouette upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/front_*_upper.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/front_*_lower.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/hind_*_upper.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/hind_*_lower.png
          git diff --cached --check
          git commit -m "fix(maotai-v2): taper limb silhouettes and soften joint overlap"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
