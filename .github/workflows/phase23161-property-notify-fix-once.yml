name: Phase 2.3.16.1 property notification patch once

on:
  push:
    branches:
      - feature/platform-automation-foundation-2.3.16.1
    paths:
      - .github/workflows/phase23161-property-notify-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/platform-automation-foundation-2.3.16.1
          fetch-depth: 0
      - name: Use existing ObservableObject notification API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              "windows/desktop/src/PicotooPet.Desktop/ViewModels/ProjectsPageViewModel.cs",
              "windows/desktop/src/PicotooPet.Desktop/ViewModels/AutomationPageViewModel.cs",
              "windows/desktop/src/PicotooPet.Desktop/ViewModels/HealthPageViewModel.cs",
          ]
          total = 0
          for name in files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              count = text.count("OnPropertyChanged(")
              if count == 0:
                  raise SystemExit(f"expected stale notification calls in {name}")
              total += count
              path.write_text(text.replace("OnPropertyChanged(", "RaisePropertyChanged("), encoding="utf-8")
          if total < 3:
              raise SystemExit(f"unexpected notification call count: {total}")
          Path(".github/workflows/phase23161-property-notify-fix-once.yml").unlink()
          PY
      - name: Commit exact patch and self-delete
        shell: bash
        run: |
          git config user.name "PicotooPet CI"
          git config user.email "picotoopet@localhost"
          git add windows/desktop/src/PicotooPet.Desktop/ViewModels .github/workflows/phase23161-property-notify-fix-once.yml
          git commit -m "fix: use existing WPF property notification API"
          git push origin HEAD:feature/platform-automation-foundation-2.3.16.1
