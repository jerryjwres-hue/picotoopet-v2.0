name: Maotai v2 Asset Audit Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-asset-audit-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6

      - name: Verify expected v2 asset count
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2"
          count="$(find "$asset_dir" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = "44"
          printf 'MAOTAI_V2_ASSET_COUNT=%s\n' "$count"

      - name: Upload raw v2 assets for visual audit
        uses: actions/upload-artifact@v4
        with:
          name: Maotai-v2-Raw-Assets-Audit
          path: windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/*.png
          if-no-files-found: error
          retention-days: 2
