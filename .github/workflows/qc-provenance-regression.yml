name: QC fallback provenance regression

on:
  pull_request:
    paths:
      - "tools/qc/**"
      - ".github/workflows/qc-provenance-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-qc:
    name: Offline QC provenance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools/qc
      HF_HUB_OFFLINE: "1"               # 不下载模型，所有测试使用合成图片或虚拟检测器。
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU-only QC test dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" opencv-python-headless pillow scipy \
            pyloudnorm pydantic av pytest
      - name: Run fail-closed regressions without model downloads
        run: |
          python -m pytest -q tools/qc/tests/test_model_provenance.py \
            tools/qc/tests/test_qc_e2e.py
