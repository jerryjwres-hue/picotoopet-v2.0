name: Maotai v2 Sleep Pose Upgrade Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-sleep-pose-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Refine lie-down sleep and wake silhouette
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "bodyWorldY += 13.0 * blend;": "bodyWorldY += 10.0 * blend;",
              "bodyScaleX += 0.070 * blend;": "bodyScaleX += 0.050 * blend;",
              "bodyScaleY -= 0.130 * blend;": "bodyScaleY -= 0.095 * blend;",
              "headOffsetY += 3.0 * blend;": "headOffsetY += 4.0 * blend;",
              "bodyWorldY += 15.0;": "bodyWorldY += 11.5;",
              "bodyScaleX += 0.090;": "bodyScaleX += 0.055;",
              "bodyScaleY -= 0.150;": "bodyScaleY -= 0.100;",
              "headOffsetY += 5.0;": "headOffsetY += 6.0;",
              "headBiasDeg += 4.0 * facingSign;": "headBiasDeg += 7.5 * facingSign;",
              "earDrop     += 3.0;": "earDrop     += 4.0;",
              "bodyWorldY += Lerp(15.0, 5.4, blend);": "bodyWorldY += Lerp(11.5, 5.4, blend);",
              "bodyScaleX += 0.090 * (1.0 - blend);": "bodyScaleX += 0.055 * (1.0 - blend);",
              "bodyScaleY -= 0.150 * (1.0 - blend);": "bodyScaleY -= 0.100 * (1.0 - blend);",
              "headOffsetY += 3.0 * (1.0 - blend);": "headOffsetY += 4.5 * (1.0 - blend);",
              "earDrop     += 3.0 * (1.0 - blend);": "earDrop     += 4.0 * (1.0 - blend);",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one sleep-pose token {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit focused sleep pose refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs
          git diff --cached --check
          git commit -m "fix(maotai-v2): make sleep pose less flattened and more tucked"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
