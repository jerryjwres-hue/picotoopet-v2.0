# actual runtime asset visual evidence
name: Maotai v2 Visual Snapshot Once

on:
  workflow_dispatch:
    inputs:
      candidate_subdir:
        description: "Optional repo-relative docs/art/maotai-v2/staging/... directory whose PNGs overlay preview only"
        required: false
        default: ""
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/maotai-v2-visual-snapshot-once.yml
      - windows/desktop/src/PicotooPet.Desktop/Views/Controls/AssistantPetPanel.xaml
      - windows/desktop/src/PicotooPet.Desktop/Views/Controls/AssistantPetPanel.xaml.cs
      - windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/**
      - windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/**
      - windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/Maotai*.cs

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2' || github.event.pull_request.head.ref == 'fix/maotai-visual-fidelity-isolated'))
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Prepare fixed app-owned Maotai v2 asset override
        shell: powershell
        env:
          MAOTAI_CANDIDATE_SUBDIR: ${{ inputs.candidate_subdir }}
        run: |
          $assetRoot = Join-Path $env:LOCALAPPDATA 'PicotooPet\ui-assets\maotai\v2'
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null
          Copy-Item 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2\*.png' $assetRoot -Force

          # Preview isolation      : manual candidate overlays may only come from the repository staging tree.
          # Promotion isolation    : overlay files exist only under LOCALAPPDATA and never modify formal runtime assets.
          $candidateSubdir = [string]$env:MAOTAI_CANDIDATE_SUBDIR
          $candidateSubdir = $candidateSubdir.Trim().Replace('\', '/')
          $overlayNames    = @()
          if ($candidateSubdir) {
            if ($candidateSubdir.StartsWith('/') -or
                $candidateSubdir.Contains('..') -or
                -not $candidateSubdir.StartsWith('docs/art/maotai-v2/staging/', [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Candidate directory must stay under docs/art/maotai-v2/staging/: $candidateSubdir"
            }

            $candidateRoot = Join-Path $env:GITHUB_WORKSPACE $candidateSubdir
            if (-not (Test-Path -LiteralPath $candidateRoot -PathType Container)) {
              throw "Candidate directory does not exist: $candidateSubdir"
            }

            foreach ($candidate in @(Get-ChildItem -LiteralPath $candidateRoot -Filter '*.png' -File)) {
              $target = Join-Path $assetRoot $candidate.Name
              if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
                throw "Candidate PNG is not one of the formal 44 asset names: $($candidate.Name)"
              }

              Copy-Item -LiteralPath $candidate.FullName -Destination $target -Force
              $overlayNames += $candidate.Name
            }

            if ($overlayNames.Count -eq 0) {
              throw "Candidate directory contains no PNG overlays: $candidateSubdir"
            }
          }

          $count = @(Get-ChildItem $assetRoot -Filter '*.png' -File).Count
          if ($count -ne 44) { throw "Expected 44 Maotai v2 assets, got $count" }

          $evidenceRoot = 'windows\desktop\artifacts\maotai-visual-snapshot'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          @(
            "source=runtime-plus-staging-overlay"
            "candidate_subdir=$candidateSubdir"
            "overlay_count=$($overlayNames.Count)"
            "overlay_files=$($overlayNames -join ',')"
          ) | Set-Content -LiteralPath (Join-Path $evidenceRoot 'maotai-candidate-overlay.txt') -Encoding utf8

          Write-Host "MAOTAI_ASSET_OVERRIDE=$assetRoot"
          Write-Host "MAOTAI_CANDIDATE_OVERLAY_COUNT=$($overlayNames.Count)"

      - name: Render deterministic Maotai visual snapshots
        shell: powershell
        run: |
          $out = 'windows\desktop\artifacts\maotai-visual-snapshot'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet run `
            --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj `
            --configuration Release `
            -p:MaotaiVisualSnapshot=true `
            -- `
            $out
          if ($LASTEXITCODE -ne 0) { throw "Maotai visual snapshot process failed with exit code $LASTEXITCODE" }
          foreach ($name in @('maotai-idle.png','maotai-work.png','maotai-sleep.png','maotai-run.png','maotai-visual-snapshot.json','maotai-candidate-overlay.txt')) {
            $path = Join-Path $out $name
            if (-not (Test-Path $path)) { throw "Missing visual evidence: $name" }
          }
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload Maotai visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: Maotai-v2-Visual-Snapshot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: windows/desktop/artifacts/maotai-visual-snapshot/*
