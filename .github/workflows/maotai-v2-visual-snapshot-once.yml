# one-shot visual evidence attempt 6: reconstruct organic front-upper candidate on Windows runner
name: Maotai v2 Visual Snapshot Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/maotai-v2-visual-snapshot-once.yml

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2'
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Reconstruct organic front-upper candidate
        shell: powershell
        run: |
          $partsRoot = '.github\maotai-candidate\front-upper-left'
          $parts = @(
            'part00.b64',
            'part01.b64',
            'part02.b64',
            'part03.b64',
            'part04-0.b64',
            'part04-1.b64',
            'part04-2.b64',
            'part05-0.b64',
            'part05-1.b64',
            'part05-2.b64'
          )
          $encoded = ($parts | ForEach-Object { Get-Content (Join-Path $partsRoot $_) -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          $sourceRoot = 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2'
          $left = Join-Path $sourceRoot 'front_left_upper.png'
          $right = Join-Path $sourceRoot 'front_right_upper.png'
          [IO.File]::WriteAllBytes($left, $bytes)

          $expected = 'D1CCFE29467027AD46B77BE3099011C51B87976D67F5CC2EC6902B043FE900AA'
          $actual = (Get-FileHash $left -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "Organic front-left candidate hash mismatch: expected=$expected actual=$actual"
          }

          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::FromFile((Resolve-Path $left))
          try {
            $bitmap.RotateFlip([System.Drawing.RotateFlipType]::RotateNoneFlipX)
            $bitmap.Save((Join-Path (Resolve-Path $sourceRoot) 'front_right_upper.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          }
          finally {
            $bitmap.Dispose()
          }

          Write-Host "MAOTAI_FRONT_LEFT_SHA256=$actual"
          Write-Host "MAOTAI_FRONT_RIGHT_SHA256=$((Get-FileHash $right -Algorithm SHA256).Hash)"

      - name: Prepare fixed app-owned Maotai v2 asset override
        shell: powershell
        run: |
          $assetRoot = Join-Path $env:LOCALAPPDATA 'PicotooPet\ui-assets\maotai\v2'
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null
          Copy-Item 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2\*.png' $assetRoot -Force
          $count = @(Get-ChildItem $assetRoot -Filter '*.png').Count
          if ($count -ne 44) { throw "Expected 44 Maotai v2 assets, got $count" }
          Write-Host "MAOTAI_ASSET_OVERRIDE=$assetRoot"

      - name: Render deterministic Maotai visual snapshots
        shell: powershell
        run: |
          $out = 'windows\desktop\artifacts\maotai-visual-snapshot'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet run `
            --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj `
            --configuration Release `
            -p:MaotaiVisualSnapshot=true `
            -- `
            $out
          if ($LASTEXITCODE -ne 0) { throw "Maotai visual snapshot process failed with exit code $LASTEXITCODE" }
          foreach ($name in @('maotai-idle.png','maotai-work.png','maotai-sleep.png','maotai-run.png','maotai-visual-snapshot.json')) {
            $path = Join-Path $out $name
            if (-not (Test-Path $path)) { throw "Missing visual evidence: $name" }
          }
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload Maotai visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: Maotai-v2-Visual-Snapshot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: windows/desktop/artifacts/maotai-visual-snapshot/*
