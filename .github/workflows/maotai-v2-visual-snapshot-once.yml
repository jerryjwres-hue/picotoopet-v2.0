# actual runtime asset visual evidence
name: Maotai v2 Visual Snapshot Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/maotai-v2-visual-snapshot-once.yml

permissions:
  contents: write

jobs:
  repair-front-upper-binaries:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild and validate exact front upper PNGs
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import struct
          import subprocess
          import sys
          import zlib
          from pathlib import Path

          root      = Path.cwd()
          tool_root = root / "windows" / "desktop" / "tools" / "maotai_v2_assets"
          asset_dir = root / "windows" / "desktop" / "src" / "PicotooPet.Desktop" / "Assets" / "Maotai" / "V2"
          output    = root / ".tmp_maotai_front_upper_repair"
          builder   = tool_root / "diagnostic_build_front_upper_candidate.py"
          expected  = {
              "front_left_upper.png":  "015b15f3659beb270f05e94e18affe23133edafce4b972c2d171f653f6b382d9",
              "front_right_upper.png": "943112c47509e84b1bbf081c82285ec1cc76825c7fb88219d101fc0abbe2be33",
          }

          subprocess.run([sys.executable, str(builder), str(output)], check=True)

          for file_name, expected_sha in expected.items():
              source = output / file_name
              data   = source.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected_sha:
                  raise SystemExit(f"{file_name}: SHA-256 mismatch: {actual}")
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise SystemExit(f"{file_name}: invalid PNG signature")

              offset = 8
              while offset < len(data):
                  length       = struct.unpack(">I", data[offset : offset + 4])[0]
                  kind         = data[offset + 4 : offset + 8]
                  start        = offset + 8
                  end          = start + length
                  payload      = data[start:end]
                  expected_crc = struct.unpack(">I", data[end : end + 4])[0]
                  actual_crc   = zlib.crc32(kind + payload) & 0xFFFFFFFF
                  if actual_crc != expected_crc:
                      raise SystemExit(f"{file_name}: CRC mismatch in {kind!r}")
                  offset = end + 4
                  if kind == b"IEND":
                      break

              (asset_dir / file_name).write_bytes(data)
              print(f"verified {file_name}: {len(data)} bytes sha256={actual}")

      - name: Commit only verified runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/front_left_upper.png \
            windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/front_right_upper.png
          if git diff --cached --quiet; then
            echo "Front upper runtime PNGs are already exact."
            exit 0
          fi
          git commit -m "fix(maotai-v2): repair exact front upper PNG binaries"
          git push origin HEAD:feature/maotai-natural-motion-v2

  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2'
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Prepare fixed app-owned Maotai v2 asset override
        shell: powershell
        run: |
          $assetRoot = Join-Path $env:LOCALAPPDATA 'PicotooPet\ui-assets\maotai\v2'
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null
          Copy-Item 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2\*.png' $assetRoot -Force
          $count = @(Get-ChildItem $assetRoot -Filter '*.png').Count
          if ($count -ne 44) { throw "Expected 44 Maotai v2 assets, got $count" }
          Write-Host "MAOTAI_ASSET_OVERRIDE=$assetRoot"

      - name: Render deterministic Maotai visual snapshots
        shell: powershell
        run: |
          $out = 'windows\desktop\artifacts\maotai-visual-snapshot'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet run `
            --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj `
            --configuration Release `
            -p:MaotaiVisualSnapshot=true `
            -- `
            $out
          if ($LASTEXITCODE -ne 0) { throw "Maotai visual snapshot process failed with exit code $LASTEXITCODE" }
          foreach ($name in @('maotai-idle.png','maotai-work.png','maotai-sleep.png','maotai-run.png','maotai-visual-snapshot.json')) {
            $path = Join-Path $out $name
            if (-not (Test-Path $path)) { throw "Missing visual evidence: $name" }
          }
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload Maotai visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: Maotai-v2-Visual-Snapshot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: windows/desktop/artifacts/maotai-visual-snapshot/*
