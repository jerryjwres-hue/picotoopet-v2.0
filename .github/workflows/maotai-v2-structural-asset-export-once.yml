name: Maotai v2 Structural Asset Export Once

on:
  pull_request:
    branches:
      - feature/interactive-pet-v1-2.3.26.1

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/maotai-natural-motion-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Collect runtime structural assets
        shell: bash
        run: |
          set -euo pipefail
          src='windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2'
          out='artifacts/maotai-v2-structural-assets'
          mkdir -p "$out"
          cp "$src"/torso_*.png "$out"/
          cp "$src"/front_*.png "$out"/
          cp "$src"/hind_*.png "$out"/
          cp "$src"/tail_*.png "$out"/
          cp "$src"/head.png "$out"/
          cp "$src"/chest_fur.png "$out"/
          sha256sum "$out"/*.png | sort > "$out/SHA256SUMS.txt"

      - name: Upload exact structural assets
        uses: actions/upload-artifact@v7
        with:
          name: Maotai-v2-Structural-Assets-${{ github.run_number }}
          path: artifacts/maotai-v2-structural-assets
          if-no-files-found: error
          retention-days: 2
