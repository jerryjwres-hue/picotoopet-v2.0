name: Maotai v2 Run Leg Lane Fix Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-run-lane-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Keep running paws in stable left right lanes
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs")
          text = path.read_text(encoding="utf-8")
          anchor = """        lockState.WasSupport = support;\n        var solved = SolveLeg("""
          replacement = """        if (grounded && moving)\n        {\n            // Front-view lane     : preserve a center gap so wide furry silhouettes never cross into an X shape.\n            // Foot-lock priority  : keep the world lock until it reaches the lane edge, then clamp only the visual paw lane.\n            var laneSign      = Math.Sign(shoulderLocalX);\n            var laneClearance = frontLeg ? 7.0 : 6.0;\n            var pawLocalX     = pawWorldX - _locomotion.PositionX;\n            pawLocalX = laneSign < 0.0\n                ? Math.Min(pawLocalX, -laneClearance)\n                : Math.Max(pawLocalX, laneClearance);\n            pawWorldX = _locomotion.PositionX + pawLocalX;\n        }\n\n        lockState.WasSupport = support;\n        var solved = SolveLeg("""
          if anchor not in text:
              raise SystemExit("BuildLockedLeg solve anchor not found")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

      - name: Commit run lane correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs
          git diff --cached --check
          git commit -m "fix: keep Maotai running legs out of center cross"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
