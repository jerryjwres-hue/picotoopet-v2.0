name: Phase 2 Windows Prebuilt Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/desktop/**"
      - "tests/release/test_windows_prebuilt_delivery.py"
      - ".github/workflows/windows-phase2-release.yml"
  push:
    branches:
      - main
    paths:
      - "windows/desktop/**"
      - "tests/release/test_windows_prebuilt_delivery.py"
      - ".github/workflows/windows-phase2-release.yml"

permissions:
  contents: read

concurrency:
  group: phase2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Native Windows build and release gate
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      PICOTOO_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PICOTOO_SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Python for release contracts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release contract dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest pytest-asyncio PyYAML

      - name: Run Windows release contract tests
        shell: powershell
        run: |
          python -m pytest tests/release/test_windows_prebuilt_delivery.py -q

      - name: Install exact .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Show Windows and .NET environment
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          dotnet --info
          $PSVersionTable.PSVersion

      - name: Reproduce legacy Task Center WPF binding failure
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Test-TaskCenterLegacyBindingRegression.ps1

      - name: Build, analyze, publish and self-test
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Build-Phase2WindowsRelease.ps1

      - name: Verify packaged install, verify and rollback lifecycle on Windows PowerShell 5.1
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Test-Phase2WindowsRelease.ps1

      - name: Upload prebuilt installer and lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Phase2-Windows-Prebuilt
          path: |
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip.sha256.txt
            windows/desktop/artifacts/release/windows-build-report.json
            windows/desktop/artifacts/release/fixture-evidence/**
          if-no-files-found: error
          retention-days: 30
