name: Phase 2.3 Slice D Windows Prebuilt Release

on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: "Native Windows runner label"
        required: true
        default: picotoopet-windows-release
        type: choice
        options:
          - picotoopet-windows-release
          - windows-2025
  pull_request:
    paths:
      - "AGENTS.md"
      - "skills/preserving-project-goals/SKILL.md"
      - "contracts/release/**"
      - "scripts/detect_component_impact.py"
      - "scripts/stamp_windows_goal_integrity.py"
      - "scripts/verify_project_goal_integrity.py"
      - "tests/**"
      - "src/**"
      - "windows/desktop/**"
      - ".github/workflows/windows-phase2-release.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "skills/preserving-project-goals/SKILL.md"
      - "contracts/release/**"
      - "scripts/detect_component_impact.py"
      - "scripts/stamp_windows_goal_integrity.py"
      - "scripts/verify_project_goal_integrity.py"
      - "tests/**"
      - "src/**"
      - "windows/desktop/**"
      - ".github/workflows/windows-phase2-release.yml"

permissions:
  contents: read

concurrency:
  group: phase23-slice-d-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Detect Windows release impact
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - name: Check out source and verified baselines
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify affected components
        id: detect
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/detect_component_impact.py \
              --baselines contracts/release/component-baselines.json \
              --head "$HEAD_SHA" \
              --force windows \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/detect_component_impact.py \
              --baselines contracts/release/component-baselines.json \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped release work
        if: steps.detect.outputs.windows != 'true'
        shell: bash
        run: echo "Windows runtime and packaging are unchanged since the verified baseline; formal ZIP construction is intentionally skipped."

  windows-release:
    needs: impact
    if: needs.impact.outputs.windows == 'true'
    name: Native Windows build and single formal release gate
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target || 'windows-2025' }}
    timeout-minutes: 50
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      PICOTOO_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PICOTOO_SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Python for release contracts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release contract dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest pytest-asyncio PyYAML

      - name: Run Windows release analyzer and goal-integrity contracts
        shell: powershell
        run: |
          python -m pytest tests/release/test_windows_prebuilt_delivery.py tests/release/test_windows_sdk_selection_contract.py tests/release/test_windows_analyzer_regressions.py tests/release/test_windows_goal_integrity_release_contract.py tests/release/test_windows_native_install_permission.py tests/release/test_windows_native_ci_provenance.py tests/release/test_self_hosted_native_runner_fallback.py tests/contract/test_component_impact_detection.py tests/contract/test_preserving_project_goals_skill.py tests/contract/test_project_goal_integrity.py tests/contract/test_windows_goal_integrity_stamper.py -q

      - name: Install exact .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Show Windows and .NET environment
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          dotnet --info
          $PSVersionTable.PSVersion

      - name: Reproduce legacy Task Center WPF binding failure
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Test-TaskCenterLegacyBindingRegression.ps1

      - name: Build analyze publish and self-test Slice D
        shell: pwsh
        run: |
          $head = $env:PICOTOO_SOURCE_HEAD_SHA
          if ([string]::IsNullOrWhiteSpace($head) -or $head.Length -lt 12) {
            throw "PICOTOO_SOURCE_HEAD_SHA 无效。"
          }
          $version = "2.3.0-slice-d-cloud-contract-$env:GITHUB_RUN_NUMBER-$($head.Substring(0, 12))"
          .\windows\desktop\scripts\Build-Phase2WindowsRelease.ps1 -Version $version

      - name: Stamp approved native WPF delivery invariants
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path "windows/desktop/artifacts/release").Path
          $packages = @(Get-ChildItem -LiteralPath $releaseRoot -Filter "PicotooPet-Phase2-Windows-Prebuilt-*.zip" -File)
          if ($packages.Count -ne 1) {
            throw "GOAL_INTEGRITY_VIOLATION: 盖章前原生 Windows ZIP 数量必须为 1，实际为 $($packages.Count)。"
          }
          $stampRoot = Join-Path $env:RUNNER_TEMP "picotoopet-windows-stamped"
          if (Test-Path -LiteralPath $stampRoot) {
            Remove-Item -LiteralPath $stampRoot -Recurse -Force
          }
          python scripts/stamp_windows_goal_integrity.py `
            $packages[0].FullName `
            --output-root $stampRoot `
            --source-head $env:PICOTOO_SOURCE_HEAD_SHA `
            --source-ref $env:PICOTOO_SOURCE_REF
          if ($LASTEXITCODE -ne 0) {
            throw "GOAL_INTEGRITY_VIOLATION: 无法加盖原生 WPF 目标合同。"
          }

          $replaceNames = @(
            $packages[0].Name,
            "$($packages[0].Name).sha256.txt",
            "windows-build-report.json",
            "project-goal-integrity-report.json"
          )
          foreach ($name in $replaceNames) {
            $existing = Join-Path $releaseRoot $name
            if (Test-Path -LiteralPath $existing) {
              Remove-Item -LiteralPath $existing -Force
            }
          }
          foreach ($file in Get-ChildItem -LiteralPath $stampRoot -File) {
            Copy-Item -LiteralPath $file.FullName -Destination $releaseRoot -Force
          }

      - name: Validate actual installer against project goal contract
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath windows/desktop/artifacts/release -Filter "PicotooPet-Phase2-Windows-Prebuilt-*.zip" -File)
          if ($packages.Count -ne 1) {
            throw "GOAL_INTEGRITY_VIOLATION: 原生 Windows 安装包数量必须为 1，实际为 $($packages.Count)。"
          }
          python scripts/verify_project_goal_integrity.py $packages[0].FullName --report windows/desktop/artifacts/release/goal-integrity-report.json
          if ($LASTEXITCODE -ne 0) {
            throw "GOAL_INTEGRITY_VIOLATION: 实际 ZIP 改变了批准的 WPF 产品目标。"
          }

      - name: Verify packaged install upgrade recovery and rollback lifecycle on Windows PowerShell 5.1
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Invoke-Phase2WindowsReleaseLifecycleGate.ps1

      - name: Upload the single formal Windows installer and lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Phase23-CloudContract-Windows-Prebuilt-${{ github.run_number }}
          path: |
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip.sha256.txt
            windows/desktop/artifacts/release/windows-build-report.json
            windows/desktop/artifacts/release/project-goal-integrity-report.json
            windows/desktop/artifacts/release/goal-integrity-report.json
            windows/desktop/artifacts/release/fixture-evidence/**
          if-no-files-found: error
          retention-days: 30
