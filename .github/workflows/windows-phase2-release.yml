name: Phase 2 Windows Prebuilt Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/desktop/**"
      - ".github/workflows/windows-phase2-release.yml"
  push:
    branches:
      - main
    paths:
      - "windows/desktop/**"
      - ".github/workflows/windows-phase2-release.yml"

permissions:
  contents: read

concurrency:
  group: phase2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Native Windows build and release gate
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install exact .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Set up native Windows Python for Worker build only
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install frozen Worker build dependencies
        shell: powershell
        run: |
          # 构建机依赖与最终用户依赖分离；发布包必须自带 Python DLL。
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7" "scipy>=1.12,<2" -r scripts/windows/requirements-executor.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show Windows and .NET environment
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          dotnet --info
          python --version
          $PSVersionTable.PSVersion

      - name: Build, analyze, publish and self-test
        shell: powershell
        run: |
          .\windows\desktop\scripts\Build-Phase2WindowsRelease.ps1

      - name: Verify packaged payload on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\windows\desktop\scripts\Test-Phase2WindowsRelease.ps1

      - name: Upload prebuilt installer and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Phase2-Windows-Prebuilt
          path: |
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip.sha256.txt
            windows/desktop/artifacts/release/windows-build-report.json
          if-no-files-found: error
          retention-days: 30
