name: Maotai v2 Torso Bootstrap Once

on:
  push:
    branches:
      - feature/maotai-natural-motion-v2
    paths:
      - .github/workflows/maotai-v2-torso-bootstrap-once.yml
      - windows/desktop/tools/maotai_v2_assets/bootstrap_expand_torso_silhouette.py

permissions:
  contents: write

jobs:
  rewrite-torso-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v6
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'

      - name: Expand only the three torso silhouettes
        run: python windows/desktop/tools/maotai_v2_assets/bootstrap_expand_torso_silhouette.py

      - name: Commit generated PNGs when changed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_neutral.png \
            windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_crouch.png \
            windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_stretch.png
          if git diff --cached --quiet; then
            echo 'MAOTAI_TORSO_BOOTSTRAP_COMMIT=NOOP'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: widen Maotai torso silhouettes'
          git push origin HEAD:feature/maotai-natural-motion-v2
