name: One-shot split Windows behavior and release contracts

on:
  push:
    branches:
      - feature/phase23-slice-d-diagnostic-snapshot-release
    paths:
      - .github/workflows/one-shot-split-windows-gates.yml

permissions:
  contents: write

jobs:
  update-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/phase23-slice-d-diagnostic-snapshot-release
          fetch-depth: 0

      - name: Update static workflow contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          delivery = Path("tests/release/test_windows_prebuilt_delivery.py")
          text = delivery.read_text(encoding="utf-8")
          text = text.replace(
              'assert "2.3.0-slice-d-diagnostic" in run_text',
              'assert "2.3.0-slice-d-approval" in run_text',
          )
          text = text.replace(
              'assert "PicotooPet-Phase23-SliceD-Windows-Prebuilt" in workflow',
              'assert "PicotooPet-Phase23-Approval-Windows-Prebuilt" in workflow',
          )
          delivery.write_text(text, encoding="utf-8")

          source = Path("tests/contract/test_phase23_windows_source.py")
          text = source.read_text(encoding="utf-8")
          old = '''def test_control_center_native_windows_ci_has_required_gates() -> None:
              """独立 Slice D CI 必须执行原生构建、自检、盖章和安装生命周期复验。"""

              workflow = (
                  ROOT / ".github" / "workflows" / "windows-control-center-ci.yml"
              ).read_text(encoding="utf-8")
              for required in (
                  "windows-2025",
                  "workflow_dispatch",
                  "inputs.runner_target",
                  "setup-python",
                  "setup-dotnet",
                  "pytest",
                  "dotnet build",
                  "PicotooPet.Desktop.Core.SmokeTests",
                  "PHASE23_TASK_CENTER_SELF_TEST=PASS",
                  "2.3.0-slice-d-diagnostic-",
                  "Build-Phase2WindowsRelease.ps1",
                  "stamp_windows_goal_integrity.py",
                  "verify_project_goal_integrity.py",
                  "Invoke-Phase2WindowsReleaseLifecycleGate.ps1",
                  "shell: pwsh",
                  "upload-artifact",
              ):
                  assert required in workflow
          '''.replace("              ", "")
          new = '''def test_control_center_and_release_ci_have_non_overlapping_required_gates() -> None:
              """WPF 行为门不重复打包；正式 Release 独占盖章和安装生命周期。"""

              control = (
                  ROOT / ".github" / "workflows" / "windows-control-center-ci.yml"
              ).read_text(encoding="utf-8")
              release = (
                  ROOT / ".github" / "workflows" / "windows-phase2-release.yml"
              ).read_text(encoding="utf-8")

              for required in (
                  "Detect Windows impact",
                  "windows-2025",
                  "workflow_dispatch",
                  "inputs.runner_target",
                  "setup-python",
                  "setup-dotnet",
                  "pytest",
                  "dotnet build",
                  "PicotooPet.Desktop.Core.SmokeTests",
                  "ShellNavigationReconnectWpfSmokeTests",
                  "PHASE23_TASK_CENTER_SELF_TEST=PASS",
                  "upload-artifact",
              ):
                  assert required in control
              for forbidden in (
                  "Build-Phase2WindowsRelease.ps1",
                  "stamp_windows_goal_integrity.py",
                  "verify_project_goal_integrity.py",
                  "Invoke-Phase2WindowsReleaseLifecycleGate.ps1",
              ):
                  assert forbidden not in control
              for required in (
                  "Detect Windows release impact",
                  "Build-Phase2WindowsRelease.ps1",
                  "stamp_windows_goal_integrity.py",
                  "verify_project_goal_integrity.py",
                  "Invoke-Phase2WindowsReleaseLifecycleGate.ps1",
                  "PicotooPet-Phase23-Approval-Windows-Prebuilt",
              ):
                  assert required in release
          '''.replace("              ", "")
          if old not in text:
              raise SystemExit("old Windows CI contract block not found")
          source.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit contract migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/contract/test_phase23_windows_source.py tests/release/test_windows_prebuilt_delivery.py
          git diff --cached --check
          git commit -m "test: split Windows behavior and formal release gates"
          git push origin HEAD:feature/phase23-slice-d-diagnostic-snapshot-release
