name: P0-296 Real Mac 2.3 StoryPack Studio Preview

on:
  pull_request:
    paths:
      - ".github/workflows/p0-296-real23-storypack-studio.yml"
      - "src/picotoopet_core/domain/storypack*.py"
      - "src/picotoopet_core/creative/dynamic_pet_story.py"
      - "src/picotoopet_core/creative/state_spine.py"
      - "src/picotoopet_core/creative/execution.py"
      - "src/picotoopet_core/creative/service.py"
      - "src/picotoopet_core/autonomous/owner_structured_review.py"
      - "src/picotoopet_core/production/service.py"
      - "src/picotoopet_core/cli.py"
      - "tests/unit/autonomous/test_owner_structured_review.py"
      - "src/picotoopet_core/api/routes/studio.py"
      - "src/picotoopet_core/api/app.py"
      - "src/picotoopet_core/autonomous/goal_service.py"
      - "src/picotoopet_core/autonomous/human_pipeline.py"
      - "src/picotoopet_core/autonomous/discovery.py"
      - "src/picotoopet_core/autonomous/local_creative.py"
      - "tests/integration/test_real23_studio_storypack_preview.py"
      - "tests/integration/test_storypack_existing_asset_intake.py"
      - "src/picotoopet_core/handoffs/approvals.py"
      - "tests/integration/queue/test_mac24_backlog_compat.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-native-mac:
    name: Native Mac 2.3 Studio scope and Worker denial
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out 2.3 based Studio adapter
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install canonical Core and CPU-only tests
        shell: bash
        run: |
          python -m pip install -e . pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.16.1

      - name: Verify StoryPack, dynamic motion, scoped Goal and Ed25519 denial
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH=.:src python -m pytest -q \
            tests/integration/test_real23_studio_storypack_preview.py \
            tests/integration/test_storypack_existing_asset_intake.py \
            tests/integration/queue/test_mac24_backlog_compat.py \
            tests/unit/autonomous/test_owner_structured_review.py \
            tests/contract/test_v31_compatible_mac_23_upgrade.py \
            tests/production/test_v11_worker_challenge_transport.py \
            tests/production/test_v11_worker_witness.py

      - name: Confirm source syntax without any GPU access
        shell: bash
        run: |
          python -m compileall -q src/picotoopet_core/domain/storypack*.py src/picotoopet_core/api/routes/studio.py src/picotoopet_core/creative/dynamic_pet_story.py
          echo "NO_DEVICE_ACCESS=YES NO_WORKER_POST=YES NO_GPU_LEASE=YES"

      - name: Hold deployment
        shell: bash
        run: |
          echo "READONLY_STORYPACK_CI=PASS; RELEASE=BLOCKED_UNTIL_CROSS_DEVICE_ACCEPTANCE"
