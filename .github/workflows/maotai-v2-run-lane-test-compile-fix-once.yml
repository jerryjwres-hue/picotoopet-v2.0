name: Maotai v2 Run Lane Test Compile Fix Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-run-lane-test-compile-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Fix reflection helper name
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/MaotaiNeutralLegGeometryV2SmokeTests.cs")
          text = path.read_text(encoding="utf-8")
          old = 'ReadProperty(pose.GetType(), "MotionState").GetValue(pose)'
          new = 'RequireProperty(pose.GetType(), "MotionState").GetValue(pose)'
          if old not in text:
              raise SystemExit("run-lane compile anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit compile correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/MaotaiNeutralLegGeometryV2SmokeTests.cs
          git diff --cached --check
          git commit -m "test: fix Maotai run lane reflection helper"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
