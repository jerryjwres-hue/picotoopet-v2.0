name: Maotai v2 Torso Family Visual Once

on:
  pull_request:
    branches:
      - feature/interactive-pet-v1-2.3.26.1

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2'
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Build no-socket crouch and stretch torso candidates
        shell: powershell
        run: |
          $assetDir = 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2'
          foreach ($name in @('torso_crouch.png', 'torso_stretch.png')) {
            $source = Join-Path $assetDir $name
            $candidate = Join-Path $assetDir ($name + '.candidate')
            python windows/desktop/tools/maotai_v2_assets/diagnostic_build_torso_candidate.py $source $candidate
            if ($LASTEXITCODE -ne 0) { throw "Torso candidate build failed for $name" }
            if (-not (Test-Path $candidate)) { throw "Missing torso candidate: $name" }
            Move-Item -LiteralPath $candidate -Destination $source -Force
            $hash = (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant()
            Write-Host "MAOTAI_TORSO_CANDIDATE_${name}_SHA256=$hash"
          }

      - name: Prepare fixed app-owned Maotai v2 asset override
        shell: powershell
        run: |
          $assetRoot = Join-Path $env:LOCALAPPDATA 'PicotooPet\ui-assets\maotai\v2'
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null
          Copy-Item 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2\*.png' $assetRoot -Force
          $count = @(Get-ChildItem $assetRoot -Filter '*.png').Count
          if ($count -ne 44) { throw "Expected 44 Maotai v2 assets, got $count" }

      - name: Render deterministic Maotai visual snapshots
        shell: powershell
        run: |
          $out = 'windows\desktop\artifacts\maotai-torso-family-snapshot'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          dotnet run `
            --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj `
            --configuration Release `
            -p:MaotaiVisualSnapshot=true `
            -- `
            $out
          if ($LASTEXITCODE -ne 0) { throw "Maotai visual snapshot process failed with exit code $LASTEXITCODE" }
          foreach ($name in @('maotai-idle.png','maotai-work.png','maotai-sleep.png','maotai-run.png','maotai-visual-snapshot.json')) {
            if (-not (Test-Path (Join-Path $out $name))) { throw "Missing visual evidence: $name" }
          }

      - name: Upload torso-family visual evidence
        uses: actions/upload-artifact@v7
        with:
          name: Maotai-v2-Torso-Family-Visual-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 2
          path: windows/desktop/artifacts/maotai-torso-family-snapshot/*
