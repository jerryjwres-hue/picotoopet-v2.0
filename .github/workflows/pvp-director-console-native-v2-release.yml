name: PVP Director Console Native v2 Prebuilt Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pvp/director-console-native-v2-bootstrap/**"
      - ".github/workflows/pvp-director-console-native-v2-release.yml"

permissions:
  contents: read

concurrency:
  group: pvp-director-native-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: PVP native Windows build and prebuilt release gate
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Reassemble and expand frozen N6E source bundle
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2-bootstrap"
          $bundle = Join-Path $env:RUNNER_TEMP "PVP_DirectorConsole_Native_V2_N6E_SOURCE.zip"
          $parts = Get-ChildItem -LiteralPath $bootstrap -Filter "source.part*.b64" | Sort-Object Name
          if ($parts.Count -lt 1) { throw "N6E source bundle parts are missing." }
          $base64 = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ""
          [System.IO.File]::WriteAllBytes($bundle, [System.Convert]::FromBase64String($base64))
          $expected = (Get-Content -LiteralPath (Join-Path $bootstrap "SOURCE_BUNDLE.sha256") -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "N6E source bundle SHA-256 mismatch." }
          $target = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2"
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          [System.IO.Directory]::CreateDirectory($target) | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($bundle, $target)

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: pvp/director-console-native-v2/global.json

      - name: Show Windows and toolchain
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          python --version
          dotnet --info
          $PSVersionTable.PSVersion

      - name: Build, publish and self-test
        shell: powershell
        run: |
          .\pvp\director-console-native-v2\scripts\Build-PvpDirectorConsoleRelease.ps1

      - name: Verify final prebuilt package on Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\pvp\director-console-native-v2\scripts\Test-PvpDirectorConsoleRelease.ps1

      - name: Upload prebuilt installer and evidence
        uses: actions/upload-artifact@v7
        with:
          name: PVP-DirectorConsole-NativeV2-Prebuilt
          path: |
            pvp/director-console-native-v2/artifacts/release/PVP-DirectorConsole-NativeV2-Prebuilt-*.zip
            pvp/director-console-native-v2/artifacts/release/PVP-DirectorConsole-NativeV2-Prebuilt-*.zip.sha256.txt
            pvp/director-console-native-v2/artifacts/release/windows-build-report.json
          if-no-files-found: error
          retention-days: 30
