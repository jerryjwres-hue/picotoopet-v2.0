name: PVP Director Console Native v2 Prebuilt Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pvp/director-console-native-v2-bootstrap/**"
      - ".github/workflows/pvp-director-console-native-v2-release.yml"

permissions:
  contents: read

concurrency:
  group: pvp-director-native-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-wpf-gate:
    name: N6E3 director experience compile publish self-test
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Reassemble frozen Native source bundle
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2-bootstrap"
          $bundle = Join-Path $env:RUNNER_TEMP "PVP_DirectorConsole_Native_N6E1.zip"
          $parts = @(Get-ChildItem -LiteralPath $bootstrap -Filter "native.part*.b64" | Sort-Object Name)
          if ($parts.Count -lt 1) { throw "N6E1 Native source bundle parts are missing." }
          $stream = [System.IO.File]::Open($bundle, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          try {
            foreach ($part in $parts) {
              $text = (Get-Content -LiteralPath $part.FullName -Raw).Trim()
              if (($text.Length % 4) -ne 0) { throw "Invalid Base64 quartet length: $($part.Name) = $($text.Length)" }
              $bytes = [System.Convert]::FromBase64String($text)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          }
          finally { $stream.Dispose() }
          $expected = (Get-Content -LiteralPath (Join-Path $bootstrap "NATIVE_BUNDLE.sha256") -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "N6E1 Native source bundle SHA-256 mismatch. expected=$expected actual=$actual" }
          $target = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2"
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          [System.IO.Directory]::CreateDirectory($target) | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($bundle, $target)

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply N6E3 Native-only director-experience patch
        shell: powershell
        run: |
          $patchDir = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2-bootstrap\n6e3-patch"
          $parts = @(Get-ChildItem -LiteralPath $patchDir -Filter "n6e3.patch*.b64" | Sort-Object Name)
          if ($parts.Count -ne 8) { throw "Expected 8 N6E3 patch parts, got $($parts.Count)." }
          $encoded = (($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join '')
          $compressed = [Convert]::FromBase64String($encoded)
          $compressedPath = Join-Path $env:RUNNER_TEMP "n6e3.patch.gz"
          $patchPath = Join-Path $env:RUNNER_TEMP "n6e3.patch"
          [IO.File]::WriteAllBytes($compressedPath, $compressed)
          python -c "import gzip, pathlib; src=pathlib.Path(r'$compressedPath'); dst=pathlib.Path(r'$patchPath'); dst.write_bytes(gzip.decompress(src.read_bytes()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:GITHUB_WORKSPACE
          try {
            git apply --no-index --directory=pvp/director-console-native-v2 -p1 --include='native/**' --whitespace=nowarn $patchPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
          $contract = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2\native\tests\test_n6e3_director_experience_contract.py"
          if (-not (Test-Path -LiteralPath $contract)) { throw "N6E3 patch did not materialize Native contract test." }

      - name: Run N6E3 Native source contracts
        shell: powershell
        run: |
          python -m unittest discover -s .\pvp\director-console-native-v2\native\tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: N6E3 safety and UX contract scan
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2"
          $nativeRuntime = Join-Path $root "native\PVP.DirectorConsole"
          $xaml = Get-Content -LiteralPath (Join-Path $nativeRuntime "MainWindow.xaml") -Raw
          $client = Get-Content -LiteralPath (Join-Path $nativeRuntime "Services\DirectorCoreClient.cs") -Raw
          $manager = Get-Content -LiteralPath (Join-Path $nativeRuntime "Services\DirectorCoreProcessManager.cs") -Raw
          foreach ($needle in @('批量选择','删除选中','恢复选中','高级详情','系统与执行准备')) {
            if (-not $xaml.Contains($needle)) { throw "Missing N6E3 UX marker: $needle" }
          }
          foreach ($needle in @('DeleteNodesAsync','RestoreNodesAsync')) {
            if (-not $client.Contains($needle)) { throw "Missing N6E3 typed client method: $needle" }
          }
          foreach ($needle in @('RunSupervisorAsync','TimeSpan.FromMilliseconds(500)','TimeSpan.FromSeconds(8)')) {
            if (-not $manager.Contains($needle)) { throw "Missing N6E3 supervisor marker: $needle" }
          }
          foreach ($forbidden in @('WebView2','RunStaticCanaryAsync','queue_prompt','/prompt')) {
            $matches = Get-ChildItem -LiteralPath $nativeRuntime -Recurse -File | Where-Object { $_.Extension -in @('.cs','.xaml') } | Select-String -SimpleMatch $forbidden -ErrorAction SilentlyContinue
            if ($matches) { throw "Forbidden Native runtime marker found: $forbidden" }
          }

      - name: Smoke exact VBS launchers under Chinese and spaced path
        shell: powershell
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2-bootstrap\vbs-smoke"
          $dst = Join-Path $env:RUNNER_TEMP "视频 制作\安装包"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Force
          foreach ($name in @('INSTALL_PVP_DIRECTOR_CONSOLE.vbs','VERIFY_PVP_DIRECTOR_CONSOLE.vbs','ROLLBACK_PVP_DIRECTOR_CONSOLE.vbs')) {
            & "$env:SystemRoot\System32\cscript.exe" //nologo (Join-Path $dst $name)
            if ($LASTEXITCODE -ne 0) { throw "$name failed cscript smoke with exit code $LASTEXITCODE" }
          }

      - name: Parse and bootstrap-smoke exact N6E2.2 installer entry
        shell: powershell
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE "pvp\director-console-native-v2-bootstrap\installer-smoke"
          $dst = Join-Path $env:RUNNER_TEMP "视频 制作\N6E22 安装包"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Force
          $ps1 = Join-Path $dst 'Install-PvpDirectorConsolePrebuilt.N6E22.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($ps1,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            throw "Exact N6E2.2 installer has PowerShell parse errors."
          }
          $env:PVP_INSTALLER_BOOTSTRAP_SMOKE = '1'
          $env:PVP_INSTALLER_CI = '1'
          & "$env:SystemRoot\System32\cmd.exe" /d /c (Join-Path $dst 'INSTALL_PVP_DIRECTOR_CONSOLE.cmd')
          if ($LASTEXITCODE -ne 0) { throw "N6E2.2 CMD bootstrap smoke failed with exit code $LASTEXITCODE" }
          $result = @(Get-ChildItem -LiteralPath $dst -Filter 'PVP_DIRECTOR_CONSOLE_N6E22_INSTALL_RESULT_*.zip')
          if ($result.Count -lt 1) { throw 'N6E2.2 bootstrap smoke did not create a result ZIP.' }
          $bootLog = Join-Path $dst 'PVP_DIRECTOR_CONSOLE_N6E22_BOOTSTRAP.log'
          if (-not (Test-Path -LiteralPath $bootLog)) { throw 'N6E2.2 bootstrap smoke did not create bootstrap log.' }
          & "$env:SystemRoot\System32\cscript.exe" //nologo (Join-Path $dst 'INSTALL_PVP_DIRECTOR_CONSOLE.vbs')
          if ($LASTEXITCODE -ne 0) { throw "N6E2.2 VBS-over-CMD bootstrap smoke failed with exit code $LASTEXITCODE" }

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: pvp/director-console-native-v2/global.json

      - name: Build Native WPF
        shell: powershell
        run: |
          $project = ".\pvp\director-console-native-v2\native\PVP.DirectorConsole\PVP.DirectorConsole.csproj"
          dotnet restore $project --runtime win-x64 --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project --configuration Release --runtime win-x64 --no-restore --nologo -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained Native EXE
        shell: powershell
        run: |
          $project = ".\pvp\director-console-native-v2\native\PVP.DirectorConsole\PVP.DirectorConsole.csproj"
          $output = ".\pvp\director-console-native-v2\artifacts\native-publish"
          dotnet publish $project --configuration Release --runtime win-x64 --self-contained true --output $output --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run published Native self-test
        shell: powershell
        run: |
          $exe = ".\pvp\director-console-native-v2\artifacts\native-publish\PVP Director Console.exe"
          $report = ".\pvp\director-console-native-v2\artifacts\native-self-test.json"
          & $exe --self-test --self-test-output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ([string]$result.status -ne "pass") { throw "Native self-test report is not pass." }

      - name: Upload N6E3 Native artifact and evidence
        uses: actions/upload-artifact@v7
        with:
          name: PVP-DirectorConsole-NativeV2-N6E3
          path: |
            pvp/director-console-native-v2/artifacts/native-publish/**
            pvp/director-console-native-v2/artifacts/native-self-test.json
          if-no-files-found: error
          retention-days: 30
