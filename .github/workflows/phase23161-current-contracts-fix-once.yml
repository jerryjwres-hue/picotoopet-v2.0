name: Phase 2.3.16.1 current contracts patch once

on:
  push:
    branches:
      - feature/platform-automation-foundation-2.3.16.1
    paths:
      - .github/workflows/phase23161-current-contracts-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/platform-automation-foundation-2.3.16.1
          fetch-depth: 0
      - name: Update only active current-version and migration-total contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version_files = [
              "tests/contract/test_phase10d_local_commit_candidate_contract.py",
              "tests/contract/test_phase23_worker_product_version.py",
              "tests/contract/test_results_center_2371_contract.py",
              "tests/integration/api/test_product_version_api.py",
              "tests/release/test_windows_goal_integrity_release_contract.py",
              "tests/unit/test_product_version.py",
              "tests/contract/test_project_goal_integrity.py",
              "tests/contract/test_windows_executable_allowlist.py",
              "tests/contract/test_windows_goal_integrity_stamper.py",
              "tests/contract/test_windows_product_version_surfaces.py",
              "windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/ProductVersionWpfSmokeTests.cs",
          ]
          for name in version_files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "2.3.15.1" not in text:
                  raise SystemExit(f"expected stale current version in {name}")
              path.write_text(text.replace("2.3.15.1", "2.3.16.1"), encoding="utf-8")

          rollup = Path("tests/contract/test_phase10c_event_stream_recovery_rollup.py")
          text = rollup.read_text(encoding="utf-8")
          old = 'EXPECTED_PRODUCT_VERSION = "2.3.15.1"\nPREVIOUS_PRODUCT_VERSION = "2.3.14.1"'
          new = 'EXPECTED_PRODUCT_VERSION = "2.3.16.1"\nPREVIOUS_PRODUCT_VERSION = "2.3.15.1"'
          if text.count(old) != 1:
              raise SystemExit("phase10c rollup version pair changed unexpectedly")
          text = text.replace(old, new)
          text = text.replace(
              '"""2.3.15.1 must retain and formally publish the cold-start recovery fix."""',
              '"""2.3.16.1 must retain and formally publish the cold-start recovery fix."""',
          )
          rollup.write_text(text, encoding="utf-8")

          migration_files = [
              "tests/unit/db/test_broker_session_migration.py",
              "tests/unit/db/test_provider_review_migration.py",
              "tests/unit/db/test_provider_session_migration.py",
              "tests/unit/db/test_return_migration.py",
          ]
          needle = 'database.scalar("SELECT COUNT(*) FROM schema_migrations") == 8'
          replacement = 'database.scalar("SELECT COUNT(*) FROM schema_migrations") == 9'
          for name in migration_files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if needle not in text:
                  raise SystemExit(f"expected stale migration total in {name}")
              path.write_text(text.replace(needle, replacement), encoding="utf-8")

          Path(".github/workflows/phase23161-current-contracts-fix-once.yml").unlink()
          PY
      - name: Commit exact patch and self-delete
        shell: bash
        run: |
          git config user.name "PicotooPet CI"
          git config user.email "picotoopet@localhost"
          git add tests windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/ProductVersionWpfSmokeTests.cs .github/workflows/phase23161-current-contracts-fix-once.yml
          git commit -m "test: converge active contracts on 2.3.16.1"
          git push origin HEAD:feature/platform-automation-foundation-2.3.16.1
