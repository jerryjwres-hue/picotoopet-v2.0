name: Maotai v2 Promote Neutral Torso Once

on:
  pull_request:
    branches:
      - feature/interactive-pet-v1-2.3.26.1

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'feature/maotai-natural-motion-v2'
    runs-on: windows-latest
    steps:
      - name: Check out feature head
        uses: actions/checkout@v6
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 1

      - name: Build promoted neutral torso
        id: build
        shell: powershell
        run: |
          $source = 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2\torso_neutral.png'
          $candidate = 'windows\desktop\src\PicotooPet.Desktop\Assets\Maotai\V2\torso_neutral.candidate.png'
          $expectedBlob = 'ec288b49086ff5dca415ba7d139101e122b30601'
          $currentBlob = (git hash-object -- $source).Trim()
          if ($currentBlob -ne $expectedBlob) {
            Write-Host "Neutral torso source already changed: $currentBlob"
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          python windows/desktop/tools/maotai_v2_assets/diagnostic_build_torso_candidate.py $source $candidate
          if ($LASTEXITCODE -ne 0) { throw "Torso candidate build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $candidate)) { throw 'Torso candidate was not produced' }

          Move-Item -LiteralPath $candidate -Destination $source -Force
          $newBlob = (git hash-object -- $source).Trim()
          if ($newBlob -eq $expectedBlob) { throw 'Torso candidate did not change the runtime asset' }
          Write-Host "MAOTAI_TORSO_PROMOTED_BLOB=$newBlob"
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Commit promoted runtime asset
        if: steps.build.outputs.changed == 'true'
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_neutral.png
          git commit -m 'fix(maotai-v2): promote no-socket neutral torso'
          git push origin HEAD:feature/maotai-natural-motion-v2
