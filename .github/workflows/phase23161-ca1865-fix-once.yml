name: Phase 2.3.16.1 CA1865 patch once

on:
  push:
    branches:
      - feature/platform-automation-foundation-2.3.16.1
    paths:
      - .github/workflows/phase23161-ca1865-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/platform-automation-foundation-2.3.16.1
          fetch-depth: 0
      - name: Apply exact analyzer-required EndsWith overload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop.Core/Networking/MacCoreAutomationClient.cs")
          text = path.read_text(encoding="utf-8")
          old = 'uri.AbsoluteUri.EndsWith("/", StringComparison.Ordinal)'
          new = "uri.AbsoluteUri.EndsWith('/')"
          if text.count(old) != 1:
              raise SystemExit(f"expected one CA1865 site, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/phase23161-ca1865-fix-once.yml").unlink()
          PY
      - name: Commit exact patch and self-delete
        shell: bash
        run: |
          git config user.name "PicotooPet CI"
          git config user.email "picotoopet@localhost"
          git add windows/desktop/src/PicotooPet.Desktop.Core/Networking/MacCoreAutomationClient.cs .github/workflows/phase23161-ca1865-fix-once.yml
          git commit -m "fix: satisfy Windows trailing slash analyzer"
          git push origin HEAD:feature/platform-automation-foundation-2.3.16.1
