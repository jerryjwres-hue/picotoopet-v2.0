name: Maotai v2 Work Paw Fix Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-work-paw-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Keep typing paws on their own keyboard sides
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs")
          text = path.read_text(encoding="utf-8")

          left_old  = "keyboardLocalX: 12.0,"
          left_new  = "keyboardLocalX: -12.0,"
          right_old = "keyboardLocalX: 21.0,"
          right_new = "keyboardLocalX: 12.0,"

          if text.count(left_old) != 1:
              raise SystemExit(f"expected exactly one left work-paw target, found {text.count(left_old)}")
          if text.count(right_old) != 1:
              raise SystemExit(f"expected exactly one right work-paw target, found {text.count(right_old)}")

          text = text.replace(left_old, left_new, 1)
          text = text.replace(right_old, right_new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit the focused MotionEngine fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs
          git diff --cached --check
          git commit -m "fix(maotai-v2): keep typing paws on own keyboard sides"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
