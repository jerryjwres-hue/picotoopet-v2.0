name: One-shot migrate 2.3.9.1 cloud contract v2

on:
  push:
    branches:
      - feature/phase23-slice-d-diagnostic-snapshot-release
    paths:
      - .github/workflows/one-shot-version-2391-cloud-contract-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/phase23-slice-d-diagnostic-snapshot-release
          fetch-depth: 0

      - name: Synchronize current non-workflow release contracts
        run: python scripts/one_shot_migrate_2391_cloud_contract.py

      - name: Commit non-workflow migration
        shell: bash
        run: |
          rm scripts/one_shot_migrate_2391_cloud_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/**'
          git diff --cached --check
          git commit -m "release: align non-workflow 2.3.9.1 contracts"
          git push origin HEAD:feature/phase23-slice-d-diagnostic-snapshot-release
