name: Maotai v2 Chest Overlay Repair Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-chest-overlay-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Render subtle visible chest fur overlay
        shell: python
        run: |
          from __future__ import annotations

          import math
          import struct
          import zlib
          from pathlib import Path

          asset = Path("windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/chest_fur.png")
          width = 124
          height = 104
          pixels = bytearray(width * height * 4)

          def clamp01(value: float) -> float:
              return max(0.0, min(1.0, value))

          def smoothstep(edge0: float, edge1: float, value: float) -> float:
              if edge0 == edge1:
                  return 1.0 if value >= edge1 else 0.0
              t = clamp01((value - edge0) / (edge1 - edge0))
              return t * t * (3.0 - 2.0 * t)

          def hash_noise(x: int, y: int, seed: int) -> float:
              value = (x * 374761393 + y * 668265263 + seed * 69069) & 0xFFFFFFFF
              value = ((value ^ (value >> 13)) * 1274126177) & 0xFFFFFFFF
              value ^= value >> 16
              return value / 4294967295.0

          for y in range(height):
              ny = ((y + 0.5) / height) * 2.0 - 1.0
              for x in range(width):
                  nx = ((x + 0.5) / width) * 2.0 - 1.0
                  n1 = hash_noise(x, y, 7103)
                  n2 = hash_noise(x // 4, y // 4, 7177)
                  noise = (0.68 * n1) + (0.32 * n2)

                  # Chest tuft        : narrow at the collar, wider in the middle, then taper to a soft V point.
                  vertical = smoothstep(-0.82, -0.50, ny) * (1.0 - smoothstep(0.40, 0.86, ny))
                  width_at_y = 0.20 + (0.24 * smoothstep(-0.55, 0.15, ny))
                  width_at_y -= 0.16 * smoothstep(0.20, 0.82, ny)
                  edge = abs(nx) - max(0.08, width_at_y)
                  furry_edge = 0.025 + (0.045 * noise)
                  side = 1.0 - smoothstep(-furry_edge, furry_edge, edge)
                  alpha = clamp01(vertical * side)

                  # Keep the overlay subtle so the detailed torso remains the dominant coat material.
                  alpha *= 0.58
                  light = clamp01(0.60 + ((1.0 - ny) * 0.18) + ((noise - 0.5) * 0.16))
                  base = 231.0 + (18.0 * light)
                  red = int(max(0, min(255, round(base))))
                  green = int(max(0, min(255, round(base - 7.0))))
                  blue = int(max(0, min(255, round(base - 10.0))))

                  offset = (y * width + x) * 4
                  pixels[offset + 0] = red
                  pixels[offset + 1] = green
                  pixels[offset + 2] = blue
                  pixels[offset + 3] = int(round(alpha * 255.0))

          raw = bytearray()
          stride = width * 4
          for row in range(height):
              raw.append(0)
              start = row * stride
              raw.extend(pixels[start:start + stride])

          def chunk(kind: bytes, payload: bytes) -> bytes:
              return (
                  struct.pack(">I", len(payload))
                  + kind
                  + payload
                  + struct.pack(">I", zlib.crc32(kind + payload) & 0xFFFFFFFF)
              )

          payload = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
              + chunk(b"IEND", b"")
          )
          asset.write_bytes(payload)
          visible = sum(1 for index in range(3, len(pixels), 4) if pixels[index] > 0)
          if visible < 500:
              raise SystemExit(f"chest overlay visible-pixel guard failed: {visible}")
          print(f"MAOTAI_V2_CHEST_OVERLAY=VISIBLE_FUR:{width}x{height}:{visible}:{len(payload)}")

      - name: Commit focused chest overlay repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/chest_fur.png
          git diff --cached --check
          git commit -m "fix(maotai-v2): restore subtle visible chest fur overlay"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
