name: Windows UI Preview Release

on:
  push:
    branches:
      - feature/windows-ui-interaction-polish-2.3.27.1
      - feature/autonomous-intelligence-e2e-goal-center-2.3.27.1
      - integration/p0-three-shot-gate-creative-candidate-v1
      - fix/p0-91-diagnostics-null-owner-crash-20261022
    paths:
      - ".github/workflows/windows-ui-preview-release.yml"
      - ".github/workflows/windows-control-center-ci.yml"
      - "tests/contract/**"
      - "tests/security/**"
      - "windows/desktop/**"
      - "src/picotoopet_core/product-version.txt"
      - "src/picotoopet_core/creative/**"
  workflow_dispatch:

concurrency:
  group: windows-ui-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  windows-ui-preview:
    name: Build and lifecycle-test Windows UI Preview
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      PICOTOO_SOURCE_HEAD_SHA: ${{ github.sha }}
      PICOTOO_SOURCE_REF: ${{ github.ref_name }}

    steps:
      # Source -----------------------------------------------------------------
      - name: Check out source
        uses: actions/checkout@v6

      # Publish the run id immediately so this source commit is traceable while
      # the installer lifecycle is still running; the final step overwrites it.
      - name: Publish Preview run start provenance
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'windows-ui-preview-release',
              description: `Windows UI Preview run ${context.runId} started`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # Python contracts --------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            pytest-cov==7.1.0 `
            ruff==0.16.1 `
            jsonschema==4.26.0 `
            PyYAML

      - name: Run Windows UI contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = ".;src"
          python -m pytest -q tests/contract tests/security

      # Native Windows UI -------------------------------------------------------
      - name: Install exact .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      # Only the strict three-shot candidate needs admission before any published WPF process.
      - name: P0 strict preview prelaunch HOLD and 28 independent no-GPU cases
        if: github.ref_name == 'integration/p0-three-shot-gate-creative-candidate-v1' || github.ref_name == 'fix/p0-91-diagnostics-null-owner-crash-20261022'
        shell: pwsh
        run: |
          $gate = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'PicotooPetV2\MediaWorker\v1\three-shot-acceptance.json'
          if ((Test-Path -LiteralPath $gate) -or (Test-Path -LiteralPath ($gate + '.armed'))) { throw 'P0_CI_GATE_NOT_EMPTY' }
          if (@(Get-CimInstance Win32_Process -Filter "Name='Picotoo Pet AI.exe'").Count -ne 0) { throw 'P0_CI_EXE_ALREADY_RUNNING' }
          # Independent 28-case suite requires a clean disposable CI runner and exercises
          # the legacy unconfigured mode; run it BEFORE arming HOLD, not afterward.
          dotnet run --project windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release -- --independent-three-shot-gate-only
          if ($LASTEXITCODE) { throw 'P0_INDEPENDENT_GATE_FAILED' }
          if ((Test-Path -LiteralPath $gate) -or (Test-Path -LiteralPath ($gate + '.armed'))) { throw 'P0_INDEPENDENT_GATE_NOT_CLEAN' }
          # Execute the *same* operator bootstrap shipped in the ZIP, never a CI-only substitute.
          & windows/desktop/scripts/Prepare-P0ThreeShotHold.ps1
          if (-not (Test-Path -LiteralPath $gate) -or -not (Test-Path -LiteralPath ($gate + '.armed'))) { throw 'P0_HOLD_BOOTSTRAP_INCOMPLETE' }
          dotnet run --no-build --project windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release -- --three-shot-gate-probe held ('a' * 64)
          if ($LASTEXITCODE) { throw 'P0_HOLD_PROBE_FAILED' }
          Write-Host 'P0_PRELAUNCH_HOLD=PASS; GPU_NETWORK=0'
      - name: Build WPF and run UI-only native smoke
        shell: pwsh
        run: |
          dotnet restore windows/desktop/PicotooPet.Desktop.sln --nologo
          dotnet build windows/desktop/PicotooPet.Desktop.sln --configuration Release --no-restore --nologo -p:ContinuousIntegrationBuild=true -warnaserror
          dotnet run --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj --configuration Release --no-build -- --ui-interaction-only

      # Preview package ---------------------------------------------------------
      - name: Build installable Windows UI Preview
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 12)
          $version  = "2.3.27.1-ui-preview-${{ github.run_number }}-$shortSha"
          & windows/desktop/scripts/Build-Phase2WindowsRelease.ps1 `
            -Version $version `
            -ValidationScope UiPreview

      - name: Verify P0 preview ZIP contains mandatory HOLD-first operator bootstrap
        if: github.ref_name == 'integration/p0-three-shot-gate-creative-candidate-v1' || github.ref_name == 'fix/p0-91-diagnostics-null-owner-crash-20261022'
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem 'windows/desktop/artifacts/release' -Filter 'PicotooPet-Phase2-Windows-Prebuilt-*.zip' -File)
          if ($zips.Count -ne 1) { throw 'P0_PREVIEW_ZIP_COUNT_INVALID' }
          $dest = Join-Path $env:RUNNER_TEMP 'p0-packed-bootstrap-check'
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $dest -Force
          $roots = @(Get-ChildItem -LiteralPath $dest -Directory)
          if ($roots.Count -ne 1) { throw 'P0_PREVIEW_PACKAGE_ROOT_INVALID' }
          $script = Join-Path $roots[0].FullName 'Prepare-P0ThreeShotHold.ps1'
          $readme = Join-Path $roots[0].FullName 'README_INSTALL_CN.txt'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf) -or -not (Test-Path -LiteralPath $readme -PathType Leaf)) { throw 'P0_PREVIEW_BOOTSTRAP_MISSING_FROM_ZIP' }
          # Copy-ReleaseFile intentionally converts .ps1 to UTF-8 with BOM for native Windows PowerShell 5.1.
          # Validate exact expected *packaged bytes*, not the original no-BOM repository file's hash.
          $source = [IO.File]::ReadAllText('windows/desktop/scripts/Prepare-P0ThreeShotHold.ps1', [Text.UTF8Encoding]::new($false, $true))
          $utf8WithBom = [Text.UTF8Encoding]::new($true)
          [byte[]]$expectedBytes = $utf8WithBom.GetPreamble() + $utf8WithBom.GetBytes($source)
          $expectedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($expectedBytes))
          $actualHash = (Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw 'P0_PREVIEW_BOOTSTRAP_HASH_MISMATCH' }
          Write-Host "P0_PREVIEW_BOOTSTRAP_PACKAGED_SHA256=$actualHash; UTF8_BOM=PASS"
          $text = Get-Content -LiteralPath $readme -Raw
          if (-not $text.StartsWith('P0 #91 严格三镜头开发预览') -or -not $text.Contains('P0_HOLD_PREPARED=PASS; ARMED=PASS')) { throw 'P0_PREVIEW_HOLD_FIRST_README_MISSING' }
          Write-Host 'P0_PREVIEW_OPERATOR_BOOTSTRAP_IN_ZIP=PASS'
      - name: Verify install upgrade recovery rollback lifecycle
        shell: pwsh
        run: |
          & windows/desktop/scripts/Test-Phase2WindowsRelease.ps1 `
            -ReleaseRoot windows/desktop/artifacts/release

      - name: P0 launch actual published GUI and unique same-EXE Worker under HOLD
        if: github.ref_name == 'integration/p0-three-shot-gate-creative-candidate-v1' || github.ref_name == 'fix/p0-91-diagnostics-null-owner-crash-20261022'
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'P0_CI_ONLY' }
          $gate = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'PicotooPetV2\MediaWorker\v1\three-shot-acceptance.json'
          $cfg = Get-Content -LiteralPath $gate -Raw | ConvertFrom-Json
          if ($cfg.mode -ne 'hold' -or -not (Test-Path -LiteralPath ($gate + '.armed'))) { throw 'P0_HOLD_REQUIRED' }
          $exe = (Resolve-Path 'windows/desktop/artifacts/release/work/payload/Picotoo Pet AI.exe').Path
          $gui = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          $workers = @()
          try {
            $until = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $gui.Refresh()
              if ($gui.HasExited) { throw ('P0_PUBLISHED_GUI_EXITED_' + $gui.ExitCode) }
              $workers = @(Get-CimInstance Win32_Process -Filter "Name='Picotoo Pet AI.exe'" | Where-Object {
                $_.ParentProcessId -eq $gui.Id -and $_.ExecutablePath -eq $exe -and $_.CommandLine -match '--p0-media-worker'
              })
            } until ($workers.Count -eq 1 -or [DateTime]::UtcNow -gt $until)
            if ($workers.Count -ne 1) { throw 'P0_PUBLISHED_SAME_EXE_WORKER_NOT_OBSERVED' }
            Start-Sleep -Seconds 3
            if (-not (Get-Process -Id $workers[0].ProcessId -ErrorAction SilentlyContinue)) { throw 'P0_PUBLISHED_WORKER_EXITED' }
            $gui.Refresh()
            if ($gui.HasExited) { throw 'P0_PUBLISHED_GUI_EXITED' }
            Write-Host 'P0_PUBLISHED_GUI_AND_SAME_EXE_WORKER_START=PASS; REAL_GPU=UNVERIFIED'
          } finally {
            $cleanup = @(@($workers) + @(Get-CimInstance Win32_Process -Filter "Name='Picotoo Pet AI.exe'" -ErrorAction SilentlyContinue | Where-Object {
              $_.ParentProcessId -eq $gui.Id -and $_.ExecutablePath -eq $exe -and $_.CommandLine -match '--p0-media-worker'
            }) | Sort-Object ProcessId -Unique)
            foreach ($worker in $cleanup) { Stop-Process -Id $worker.ProcessId -Force -ErrorAction SilentlyContinue }
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue }
            $gui.Dispose()
          }
      - name: Create outer artifact SHA-256
        shell: pwsh
        run: |
          $root = "windows/desktop/artifacts/release"
          $zips = @(Get-ChildItem -LiteralPath $root -Filter "PicotooPet-Phase2-Windows-Prebuilt-*.zip" -File)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one Windows UI Preview ZIP, found $($zips.Count)."
          }
          $zip  = $zips[0]
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $root "artifact-sha256.txt"),
            "$hash  $($zip.Name)`n",
            [System.Text.UTF8Encoding]::new($false))

      - name: P0 preview package source and published EXE hash evidence
        if: github.ref_name == 'integration/p0-three-shot-gate-creative-candidate-v1' || github.ref_name == 'fix/p0-91-diagnostics-null-owner-crash-20261022'
        shell: pwsh
        run: |
          $root = 'windows/desktop/artifacts/release'
          $manifest = Get-Content -LiteralPath "$root/work/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.full_release -or $manifest.validation_scope -ne 'windows-ui-preview' -or $manifest.source_head -ne $env:PICOTOO_SOURCE_HEAD_SHA) { throw 'P0_PREVIEW_PROVENANCE_INVALID' }
          if (-not $manifest.native_ci_verified -or -not $manifest.user_install_allowed) { throw 'P0_PREVIEW_NATIVE_PACKAGE_NOT_VERIFIED' }
          $entry = @($manifest.files | Where-Object path -eq 'Picotoo Pet AI.exe')
          if ($entry.Count -ne 1) { throw 'P0_PREVIEW_EXE_MANIFEST_ENTRY_MISSING' }
          $actual = (Get-FileHash -LiteralPath "$root/work/payload/Picotoo Pet AI.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $entry[0].sha256) { throw 'P0_PREVIEW_EXE_SHA_MISMATCH' }
          $zip = @(Get-ChildItem -LiteralPath $root -Filter 'PicotooPet-Phase2-Windows-Prebuilt-*.zip' -File)
          if ($zip.Count -ne 1) { throw 'P0_PREVIEW_ZIP_AMBIGUOUS' }
          $evidence = [ordered]@{
            label = 'P0 Developer Preview'; source_sha = $env:PICOTOO_SOURCE_HEAD_SHA; workflow_run = $env:GITHUB_RUN_ID
            validation_scope = $manifest.validation_scope; formal_release = $false
            p0_gate_28_cases = 'PASS'; prelaunch_hold = 'PASS'; native_ui_and_worker_launch = 'PASS'
            zip_sha256 = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            exe_sha256 = $actual; live_mac_core = 'UNVERIFIED'; real_comfy_gpu = 'UNVERIFIED'
          }
          $evidence | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath "$root/p0-preview-lifecycle-evidence.json" -Encoding utf8
          Copy-Item -LiteralPath "$root/work/release-manifest.json" -Destination "$root/release-manifest.json"
          Write-Host "P0_NATIVE_PREVIEW_INSTALL_LIFECYCLE=PASS; SOURCE_SHA=$env:PICOTOO_SOURCE_HEAD_SHA; EXE_SHA256=$actual"
      - name: Upload Windows UI Preview evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Windows-UI-Preview-2.3.27.1-${{ github.run_number }}
          path: |
            windows/desktop/artifacts/release/PicotooPet-Phase2-Windows-Prebuilt-*.zip
            windows/desktop/artifacts/release/*.sha256.txt
            windows/desktop/artifacts/release/artifact-sha256.txt
            windows/desktop/artifacts/release/windows-build-report.json
            windows/desktop/artifacts/release/p0-preview-lifecycle-evidence.json
            windows/desktop/artifacts/release/release-manifest.json
            windows/desktop/artifacts/release/fixture-evidence/**
          if-no-files-found: error
          retention-days: 14

      # Provenance --------------------------------------------------------------
      - name: Publish Preview run provenance to source commit
        if: always()
        uses: actions/github-script@v8
        env:
          PREVIEW_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.PREVIEW_JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'windows-ui-preview-release',
              description: `Windows UI Preview run ${context.runId} ${state}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
