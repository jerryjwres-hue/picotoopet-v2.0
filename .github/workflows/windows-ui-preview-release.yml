name: Windows P0 Developer Preview (NOT Formal Release)
on:
  push:
    branches: [build/p0-developer-preview-9b6faec-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-developer-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PICOTOO_SOURCE_HEAD_SHA: 9b6faec72dfba7da0db31fcd2cbce5388480bb88
      PICOTOO_SOURCE_REF: integration/p0-three-shot-gate-creative-candidate-v1
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Read isolated workflow and deployment instructions
        uses: actions/checkout@v6
        with:
          path: preview-control
      - name: Check out exact immutable application source (no production edits)
        uses: actions/checkout@v6
        with:
          ref: 9b6faec72dfba7da0db31fcd2cbce5388480bb88
          path: source
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: source/windows/desktop/global.json
      - name: Verify source identity and existing HOLD regressions
        run: |
          if ((git rev-parse HEAD) -ne $env:PICOTOO_SOURCE_HEAD_SHA) { throw 'SOURCE_SHA_MISMATCH' }
          git diff --exit-code
          if ($LASTEXITCODE) { throw 'SOURCE_DIRTY' }
          dotnet build windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release --warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build --project windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release -- --independent-three-shot-gate-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare HOLD before any published GUI or worker launch (CI only)
        run: |
          $gate = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'PicotooPetV2\MediaWorker\v1\three-shot-acceptance.json'
          if ((Test-Path -LiteralPath $gate) -or (Test-Path -LiteralPath ($gate + '.armed'))) { throw 'CI_GATE_NOT_EMPTY' }
          New-Item -ItemType Directory -Path (Split-Path -Parent $gate) -Force | Out-Null
          [IO.File]::WriteAllBytes($gate + '.armed', [byte[]]@(1))
          [IO.File]::WriteAllText($gate, '{"schema_version":"1.0","mode":"hold"}', [Text.UTF8Encoding]::new($false))
          $digest = 'a' * 64
          dotnet run --no-build --project windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release -- --three-shot-gate-probe held $digest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'P0_PRELAUNCH_HOLD=PASS'
      - name: Reuse original builder in explicitly non-formal UiPreview scope
        run: |
          $version = 'P0-Developer-Preview-' + $env:GITHUB_RUN_ID + '-9b6faec72dfb'
          & windows/desktop/scripts/Build-Phase2WindowsRelease.ps1 -Version $version -ValidationScope UiPreview
      - name: Reuse existing install upgrade verify failure-recovery rollback tests
        run: |
          & windows/desktop/scripts/Test-Phase2WindowsRelease.ps1 -ReleaseRoot windows/desktop/artifacts/release
      - name: Start actual published WPF and same-EXE worker under HOLD (CI only, no pairing or GPU)
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'CI_ONLY' }
          $gate = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'PicotooPetV2\MediaWorker\v1\three-shot-acceptance.json'
          if ((Get-Content -LiteralPath $gate -Raw | ConvertFrom-Json).mode -ne 'hold') { throw 'HOLD_REQUIRED' }
          $exe = (Resolve-Path 'windows/desktop/artifacts/release/work/payload/Picotoo Pet AI.exe').Path
          $gui = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          $workers = @()
          try {
            $until = [DateTime]::UtcNow.AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 250
              $gui.Refresh()
              if ($gui.HasExited) { throw ('PUBLISHED_GUI_EXITED_' + $gui.ExitCode) }
              $workers = @(Get-CimInstance Win32_Process -Filter "Name='Picotoo Pet AI.exe'" | Where-Object {
                $_.ParentProcessId -eq $gui.Id -and $_.ExecutablePath -eq $exe -and $_.CommandLine -match '--p0-media-worker'
              })
            } until ($workers.Count -eq 1 -or [DateTime]::UtcNow -gt $until)
            if ($workers.Count -ne 1) { throw 'PUBLISHED_SAME_EXE_WORKER_NOT_OBSERVED' }
            Start-Sleep -Seconds 3
            if (-not (Get-Process -Id $workers[0].ProcessId -ErrorAction SilentlyContinue)) { throw 'PUBLISHED_WORKER_EXITED' }
            $gui.Refresh()
            if ($gui.HasExited) { throw 'PUBLISHED_GUI_EXITED' }
            'P0_PUBLISHED_GUI_AND_SAME_EXE_WORKER_START=PASS; REAL_GPU=UNVERIFIED'
          } finally {
            # Only these synthetic CI processes, never a user computer or broad process-name kill.
            foreach ($worker in $workers) { Stop-Process -Id $worker.ProcessId -Force -ErrorAction SilentlyContinue }
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue }
            $gui.Dispose()
          }
      - name: Record package EXE dependency inventory and exact build provenance
        run: |
          $root = 'windows/desktop/artifacts/release'
          $manifest = Get-Content -LiteralPath "$root/work/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.full_release -or $manifest.validation_scope -ne 'windows-ui-preview' -or $manifest.source_head -ne $env:PICOTOO_SOURCE_HEAD_SHA) { throw 'PREVIEW_PROVENANCE_INVALID' }
          if (-not $manifest.native_ci_verified -or -not $manifest.user_install_allowed) { throw 'NATIVE_PACKAGE_NOT_VERIFIED' }
          $zip = @(Get-ChildItem -LiteralPath $root -Filter '*.zip' -File)
          if ($zip.Count -ne 1) { throw 'AMBIGUOUS_PREVIEW_ZIP' }
          $exeEntry = @($manifest.files | Where-Object path -eq 'Picotoo Pet AI.exe')
          if ($exeEntry.Count -ne 1) { throw 'EXE_MANIFEST_ENTRY_MISSING' }
          $actualExeSha = (Get-FileHash -LiteralPath "$root/work/payload/Picotoo Pet AI.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualExeSha -ne $exeEntry[0].sha256) { throw 'EXE_SHA_MISMATCH' }
          $deps = Get-Content -LiteralPath 'windows/desktop/src/PicotooPet.Desktop/obj/project.assets.json' -Raw | ConvertFrom-Json
          $evidence = [ordered]@{
            label = 'P0 Developer Preview'; formal_release = $false; source_sha = $env:PICOTOO_SOURCE_HEAD_SHA
            workflow_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; product_version = $manifest.product_version
            zip = $zip[0].Name; zip_sha256 = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            exe_sha256 = $actualExeSha; native_ui_and_worker_launch = 'PASS'; prelaunch_hold = 'PASS'
            live_mac_core = 'UNVERIFIED'; real_comfy_gpu = 'UNVERIFIED'; formal_maotai_gate = 'BLOCKED'
            dependency_libraries = @($deps.libraries.PSObject.Properties.Name | Sort-Object); files = $manifest.files
          }
          $evidence | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath "$root/p0-developer-preview-evidence.json" -Encoding utf8NoBOM
          Copy-Item -LiteralPath "$root/work/release-manifest.json" -Destination "$root/release-manifest.json"
          Copy-Item -LiteralPath '../preview-control/docs/p0_video_acceptance/P0_DEVELOPER_PREVIEW_SAFE_DEPLOYMENT.md' -Destination "$root/P0-DEVELOPER-PREVIEW-READ-FIRST.md"
          "P0_PREVIEW_ZIP=$($evidence.zip)"
          "P0_PREVIEW_ZIP_SHA256=$($evidence.zip_sha256)"
          "P0_PREVIEW_EXE_SHA256=$($evidence.exe_sha256)"
          $evidence | ConvertTo-Json -Depth 3 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload P0 Developer Preview only after all native package gates pass
        uses: actions/upload-artifact@v7
        with:
          name: P0-Developer-Preview-9b6faec72dfb-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            source/windows/desktop/artifacts/release/*.zip
            source/windows/desktop/artifacts/release/*.sha256.txt
            source/windows/desktop/artifacts/release/*.json
            source/windows/desktop/artifacts/release/P0-DEVELOPER-PREVIEW-READ-FIRST.md
            source/windows/desktop/artifacts/release/fixture-evidence/**
