name: Maotai v2 Texture Upgrade Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-texture-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Repaint placeholder limb textures with anti-aliased furry materials
        shell: python
        run: |
          from __future__ import annotations

          import math
          import struct
          import zlib
          from pathlib import Path

          ASSET_DIR = Path("windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2")

          # Each output keeps the existing @2x contract while replacing the old 3–4-color placeholders.
          TARGETS = {
              "front_left_upper.png":  (68, 92, "front_upper", False),
              "front_right_upper.png": (68, 92, "front_upper", True),
              "front_left_lower.png":  (64, 88, "front_lower", False),
              "front_right_lower.png": (64, 88, "front_lower", True),
              "hind_left_upper.png":   (76, 88, "hind_upper", False),
              "hind_right_upper.png":  (76, 88, "hind_upper", True),
              "hind_left_lower.png":   (72, 84, "hind_lower", False),
              "hind_right_lower.png":  (72, 84, "hind_lower", True),
          }

          def clamp01(value: float) -> float:
              return max(0.0, min(1.0, value))

          def smoothstep(edge0: float, edge1: float, value: float) -> float:
              if edge0 == edge1:
                  return 1.0 if value >= edge1 else 0.0
              t = clamp01((value - edge0) / (edge1 - edge0))
              return t * t * (3.0 - 2.0 * t)

          def hash_noise(x: int, y: int, seed: int) -> float:
              value = (x * 374761393 + y * 668265263 + seed * 69069) & 0xFFFFFFFF
              value = ((value ^ (value >> 13)) * 1274126177) & 0xFFFFFFFF
              value ^= value >> 16
              return value / 4294967295.0

          def shape_mask(nx: float, ny: float, kind: str, mirror: bool, noise: float) -> float:
              x = -nx if mirror else nx
              if kind == "front_upper":
                  center = -0.08 + 0.10 * math.sin((ny + 0.15) * 2.1)
                  half   = 0.44 - 0.10 * max(0.0, ny) + 0.05 * math.cos(ny * 2.8)
                  edge   = abs(x - center) - half
                  top    = smoothstep(-0.92, -0.80, ny)
                  bottom = 1.0 - smoothstep(0.70 + 0.06 * noise, 0.93, ny)
              elif kind == "front_lower":
                  center = 0.02 + 0.15 * math.sin((ny + 0.25) * 1.8)
                  half   = 0.34 + 0.05 * (1.0 - ny)
                  edge   = abs(x - center) - half
                  top    = smoothstep(-0.92, -0.66 + 0.06 * noise, ny)
                  bottom = 1.0 - smoothstep(0.72, 0.94, ny)
              elif kind == "hind_upper":
                  center = -0.06 + 0.15 * math.sin((ny + 0.10) * 1.7)
                  half   = 0.49 - 0.09 * max(0.0, ny)
                  edge   = abs(x - center) - half
                  top    = smoothstep(-0.94, -0.80, ny)
                  bottom = 1.0 - smoothstep(0.68 + 0.05 * noise, 0.94, ny)
              else:
                  center = 0.03 + 0.18 * math.sin((ny + 0.30) * 1.7)
                  half   = 0.37 + 0.06 * (1.0 - ny)
                  edge   = abs(x - center) - half
                  top    = smoothstep(-0.94, -0.66 + 0.05 * noise, ny)
                  bottom = 1.0 - smoothstep(0.70, 0.94, ny)

              furry_edge = 0.035 + 0.045 * noise
              side = 1.0 - smoothstep(-furry_edge, furry_edge, edge)
              return clamp01(side * top * bottom)

          def fur_color(nx: float, ny: float, kind: str, noise: float) -> tuple[int, int, int]:
              # Upper segments remain charcoal; lower segments fade into cream so the existing paws read as continuous fur.
              lower_kind = kind.endswith("lower")
              transition = smoothstep(-0.15, 0.52, ny) if lower_kind else smoothstep(0.28, 0.92, ny)
              dark = (58, 49, 67)
              mid  = (91, 75, 88)
              light = (239, 226, 222)

              if lower_kind:
                  base = tuple(mid[i] * (1.0 - transition) + light[i] * transition for i in range(3))
              else:
                  base = tuple(dark[i] * (1.0 - transition) + mid[i] * transition for i in range(3))

              # Multi-scale deterministic grain replaces flat fills without introducing runtime assets or dependencies.
              grain = (noise - 0.5) * 24.0
              sheen = max(0.0, 1.0 - abs(nx + 0.25)) * 9.0
              return tuple(max(0, min(255, int(round(channel + grain + sheen)))) for channel in base)

          def png_bytes(width: int, height: int, pixels: bytes) -> bytes:
              raw = bytearray()
              stride = width * 4
              for row in range(height):
                  raw.append(0)
                  start = row * stride
                  raw.extend(pixels[start:start + stride])

              def chunk(kind: bytes, payload: bytes) -> bytes:
                  return (
                      struct.pack(">I", len(payload))
                      + kind
                      + payload
                      + struct.pack(">I", zlib.crc32(kind + payload) & 0xFFFFFFFF)
                  )

              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(bytes(raw), 9))
                  + chunk(b"IEND", b"")
              )

          def render(width: int, height: int, kind: str, mirror: bool, seed: int) -> bytes:
              pixels = bytearray(width * height * 4)
              for y in range(height):
                  ny = ((y + 0.5) / height) * 2.0 - 1.0
                  for x in range(width):
                      nx = ((x + 0.5) / width) * 2.0 - 1.0

                      # Blend three scales of noise to create soft strand breakup around the contour and inside the coat.
                      n1 = hash_noise(x, y, seed)
                      n2 = hash_noise(x // 2, y // 3, seed + 17)
                      n3 = hash_noise(x // 5, y // 7, seed + 43)
                      noise = 0.52 * n1 + 0.30 * n2 + 0.18 * n3

                      alpha = shape_mask(nx, ny, kind, mirror, noise)
                      # Slight vertical strand modulation keeps the surface from reading as vector geometry.
                      strand = 0.92 + 0.08 * math.sin((x * 0.72) + (y * 0.19) + seed)
                      alpha = clamp01(alpha * strand)
                      red, green, blue = fur_color(-nx if mirror else nx, ny, kind, noise)

                      offset = (y * width + x) * 4
                      pixels[offset + 0] = red
                      pixels[offset + 1] = green
                      pixels[offset + 2] = blue
                      pixels[offset + 3] = int(round(alpha * 255.0))

              return png_bytes(width, height, bytes(pixels))

          for index, (name, (width, height, kind, mirror)) in enumerate(TARGETS.items(), start=1):
              payload = render(width, height, kind, mirror, 1300 + index * 97)
              path = ASSET_DIR / name
              path.write_bytes(payload)
              print(f"MAOTAI_V2_REPAINTED={name}:{width}x{height}:{len(payload)}")

      - name: Commit focused asset upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/front_*_upper.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/front_*_lower.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/hind_*_upper.png
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/hind_*_lower.png
          git diff --cached --check
          git commit -m "fix(maotai-v2): replace flat limb placeholders with furry textures"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
