name: P0-Q2 Real Core Worker HTTP Interop Windows CPU
on:
  push:
    branches:
      - test/p0q2-real-core-worker-http-interop-20261030
    paths:
      - tests/integration/real_core_worker_http_server.py
      - windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests/RealPythonCoreInteropTests.cs
      - .github/workflows/p0q2-real-core-worker-http-interop-windows.yml
      - docs/p0_video_quality/security/REAL_CORE_WORKER_HTTP_INTEROP.md
  pull_request:
    paths:
      - tests/integration/real_core_worker_http_server.py
      - windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests/RealPythonCoreInteropTests.cs
      - .github/workflows/p0q2-real-core-worker-http-interop-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-python-core-windows-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-cpu-only:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      P0_REAL_CORE_LOCALHOST_CI_ONLY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json
      - name: Install real existing Mac Core runtime on disposable Windows runner
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e . pytest cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build existing DPAPI/Ed25519 Worker smoke host (no production files changed)
        shell: pwsh
        run: |
          dotnet build windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual FastAPI localhost Challenge to Worker signed Witness 409 and SQLite proof
        timeout-minutes: 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ── Isolated CI process and temp directory, never a user Core/Comfy host.
          $root = Join-Path $env:RUNNER_TEMP ("p0-real-core-interop-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:P0_REAL_CORE_INTEROP_ROOT = $root
          $env:P0_CORE_INTEROP_BEARER = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')
          $exe = Join-Path $pwd 'windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests/bin/Release/net10.0-windows10.0.19041.0/PicotooPet.MediaWorker.SmokeTests.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'NATIVE_WORKER_SMOKE_HOST_MISSING' }
          $server = $null
          # ── Each real .NET Worker phase is independently bounded, so a
          # ── stalled security check cannot hold a CI runner indefinitely.
          function Invoke-RealWorkerPhase([string]$phase) {
            $env:P0_REAL_CORE_INTEROP_ACTION = $phase
            Write-Output ("REAL_INTEROP_PHASE_BEGIN=" + $phase)
            $worker = Start-Process -FilePath $exe -NoNewWindow -PassThru
            try {
              if (!$worker.WaitForExit(90000)) {
                Stop-Process -Id $worker.Id -Force -ErrorAction SilentlyContinue
                throw ("REAL_INTEROP_PHASE_TIMEOUT=" + $phase)
              }
              if ($worker.ExitCode -ne 0) { throw ("REAL_INTEROP_PHASE_FAILURE=" + $phase) }
            }
            finally { $worker.Dispose() }
            Write-Output ("REAL_INTEROP_PHASE_PASS=" + $phase)
          }
          try {
            # ── Public key is generated by the actual existing DPAPI signer,
            # ── not an invented C# signature fixture or production registration.
            Invoke-RealWorkerPhase 'seed-key'
            Remove-Item Env:P0_REAL_CORE_INTEROP_ACTION
            python tests/integration/real_core_worker_http_server.py seed --root $root --identity (Join-Path $root 'identity-public.json')
            if ($LASTEXITCODE -ne 0) { throw 'REAL_CORE_SQLITE_SEED_FAILED' }

            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            $listener.Stop()
            $env:P0_REAL_CORE_URL = "http://127.0.0.1:$port/"
            # ── Launch the REAL Python Core service via uvicorn, never a .NET
            # ── fake HTTP dispatcher. No access logs, secrets or remote bind.
            $server = Start-Process -FilePath (Get-Command python).Source -ArgumentList @(
              '-u', 'tests/integration/real_core_worker_http_server.py', 'serve',
              '--root', $root, '--port', "$port"
            ) -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $root 'core-stdout.txt') -RedirectStandardError (Join-Path $root 'core-stderr.txt')
            $manifest = Get-Content -LiteralPath (Join-Path $root 'interop-fixture-public.json') -Raw | ConvertFrom-Json
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              if ($server.HasExited) { throw 'REAL_PYTHON_CORE_EARLY_EXIT' }
              try {
                $response = Invoke-WebRequest -Uri ($env:P0_REAL_CORE_URL + 'api/v1/production/jobs/' + $manifest.job_id) -Headers @{ Authorization = ('Bearer ' + $env:P0_CORE_INTEROP_BEARER) } -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (!$ready) { throw 'REAL_FASTAPI_NOT_READY_ON_LOCALHOST' }

            Invoke-RealWorkerPhase 'run'
            Invoke-RealWorkerPhase 'negatives'
            python tests/integration/real_core_worker_http_server.py assert --root $root
            if ($LASTEXITCODE -ne 0) { throw 'REAL_CORE_SQLITE_0_LEASE_ATTEMPT_FAILED' }

            # ── Expire only the runner's previous challenge, then verify a
            # ── distinct real API nonce can be issued (old one remains durable).
            python tests/integration/real_core_worker_http_server.py expire --root $root
            if ($LASTEXITCODE -ne 0) { throw 'REAL_CORE_TEST_EXPIRY_MUTATION_FAILED' }
            Invoke-RealWorkerPhase 'reissue'

            # ── Revoke approval after Core issued nonce, then Core must deny.
            python tests/integration/real_core_worker_http_server.py revoke --root $root
            if ($LASTEXITCODE -ne 0) { throw 'REAL_CORE_TEST_APPROVAL_REVOCATION_FAILED' }
            Invoke-RealWorkerPhase 'after-revoke'
            $env:P0_CORE_INTEROP_EXPECT_CHALLENGES = '2'
            python tests/integration/real_core_worker_http_server.py assert --root $root
            if ($LASTEXITCODE -ne 0) { throw 'REAL_CORE_POST_REVOCATION_IMMUTABILITY_FAILED' }
            Write-Output 'P0_REAL_CORE_HTTP_INTEROP=PASS; EXPECTED_409=PASS; DPAPI_ED25519=PASS; LEASE=0; ATTEMPT=0; COMFY_POST=0'
          }
          finally {
            # ── Always stop the child server. No remote machine, GPU or model.
            if ($server -and !$server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
              $server.WaitForExit(10000) | Out-Null
            }
            Remove-Item Env:P0_REAL_CORE_INTEROP_ACTION -ErrorAction SilentlyContinue
            Remove-Item Env:P0_CORE_INTEROP_BEARER -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Force -Recurse -ErrorAction SilentlyContinue
          }
