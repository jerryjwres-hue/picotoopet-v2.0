name: Crawl4AI Research Adapter 2.3.27.1

on:
  push:
    branches:
      - feature/crawl4ai-research-adapter-2.3.27.1
    paths:
      - ".github/workflows/crawl4ai-research-adapter-ci.yml"
      - "research_gateway/**"
      - "deploy/macos/crawl4ai_research_adapter/**"
      - "scripts/mac/crawl4ai_research_adapter/**"
      - "tests/unit/research_gateway/test_crawler_adapter.py"
      - "tests/contract/test_crawl4ai_research_adapter_package.py"
  pull_request:
    branches:
      - feature/research-gateway-2.3.27.1-final
    paths:
      - ".github/workflows/crawl4ai-research-adapter-ci.yml"
      - "research_gateway/**"
      - "deploy/macos/crawl4ai_research_adapter/**"
      - "scripts/mac/crawl4ai_research_adapter/**"
      - "tests/unit/research_gateway/test_crawler_adapter.py"
      - "tests/contract/test_crawl4ai_research_adapter_package.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-policy-contracts:
    name: Native macOS arm64 crawler policy RED gate
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out Crawl4AI adapter branch
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify native architecture
        shell: bash
        run: |
          # 架构门禁：本能力包只交付给 Apple Silicon Mac Research Worker。
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install repository test dependencies
        shell: bash
        run: |
          # RED 阶段只安装仓库测试依赖，不安装或升级 Crawl4AI、Scrapling、Chrome。
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Run crawler provider policy tests
        shell: bash
        run: |
          PYTHONPATH=.:src python -m pytest -q \
            tests/unit/research_gateway/test_crawler_adapter.py
