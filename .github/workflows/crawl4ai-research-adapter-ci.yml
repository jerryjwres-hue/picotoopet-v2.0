name: Crawl4AI Research Adapter 2.3.27.1

on:
  push:
    branches:
      - feature/crawl4ai-research-adapter-2.3.27.1
    paths:
      - ".github/workflows/crawl4ai-research-adapter-ci.yml"
      - "research_gateway/**"
      - "deploy/macos/crawl4ai_research_adapter/**"
      - "scripts/mac/crawl4ai_research_adapter/**"
      - "tests/unit/research_gateway/**"
      - "tests/unit/worker/test_research_gateway_execution.py"
      - "tests/contract/test_crawl4ai_research_adapter_package.py"
      - "tests/contract/test_research_gateway_package.py"
      - "tests/integration/api/test_research_search_api.py"
  pull_request:
    branches:
      - feature/research-gateway-2.3.27.1-final
    paths:
      - ".github/workflows/crawl4ai-research-adapter-ci.yml"
      - "research_gateway/**"
      - "deploy/macos/crawl4ai_research_adapter/**"
      - "scripts/mac/crawl4ai_research_adapter/**"
      - "tests/unit/research_gateway/**"
      - "tests/unit/worker/test_research_gateway_execution.py"
      - "tests/contract/test_crawl4ai_research_adapter_package.py"
      - "tests/contract/test_research_gateway_package.py"
      - "tests/integration/api/test_research_search_api.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Native macOS arm64 install / live crawl / rollback
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BASELINE_SHA: "1c536fe4f13206a6a6ecd50728e27d8f2764112e"

    steps:
      - name: Check out Crawl4AI adapter branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify native architecture and baseline ancestry
        shell: bash
        run: |
          sw_vers
          uname -m
          python --version
          test "$(uname -m)" = "arm64"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD

      - name: Install repository test dependencies
        shell: bash
        run: |
          # 测试工具装在 CI Python；Crawl4AI 只在后面的正式包私有 venv 安装。
          python -m pip install -e . pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.16.1

      - name: Run crawler and existing Research contracts
        shell: bash
        run: |
          PYTHONPATH=.:src python -m pytest -q \
            tests/unit/research_gateway \
            tests/unit/worker/test_research_gateway_execution.py \
            tests/contract/test_crawl4ai_research_adapter_package.py \
            tests/contract/test_research_gateway_package.py \
            tests/integration/api/test_research_search_api.py

      - name: Lint and compile changed Python
        shell: bash
        run: |
          ruff check \
            research_gateway \
            tests/unit/research_gateway \
            tests/contract/test_crawl4ai_research_adapter_package.py
          python -m compileall -q research_gateway scripts

      - name: Verify governance and baseline-aware full regression
        shell: bash
        run: |
          if [[ -f scripts/verify_alignment.py ]]; then
            python scripts/verify_alignment.py --ci
          else
            echo "ALIGNMENT_VERIFIER=NOT_PRESENT_PREEXISTING_GOVERNANCE_DRIFT"
          fi
          # 精确 baseline 自身已存在 4 个 Windows 五入口旧断言；只允许这组已重现失败，任何新增失败仍阻断。
          bash scripts/mac/crawl4ai_research_adapter/Verify-BaselineRegressionParity.sh

      - name: Validate adapter shell syntax
        shell: bash
        run: |
          for script in \
            deploy/macos/crawl4ai_research_adapter/*.command \
            scripts/mac/crawl4ai_research_adapter/*.sh; do
            bash -n "$script"
          done

      - name: Build Mac arm64 package and SHA-256
        shell: bash
        run: |
          bash scripts/mac/crawl4ai_research_adapter/Build-Crawl4AIResearchAdapterPackage.sh \
            --output-root artifacts/crawl4ai-research-adapter

      - name: Verify package integrity and scoped rollback fixture
        shell: bash
        run: |
          bash scripts/mac/crawl4ai_research_adapter/Test-Crawl4AIResearchAdapterPackage.sh \
            artifacts/crawl4ai-research-adapter

      - name: Prepare isolated existing Research runtime fixture
        id: fixture
        shell: bash
        run: |
          # 仅 Exa discovery 使用固定 fixture；真实 Crawl4AI 内容来自公开网页。
          fixture_root="$RUNNER_TEMP/picotoopet-crawl4ai-live"
          fixture_home="$fixture_root/home"
          gateway_root="$fixture_home/Library/Application Support/PicotooPet/ResearchGateway"
          gateway_runtime="$gateway_root/runtime"
          worker_root="$fixture_home/Library/Application Support/PicotooPetV2"
          fake_bin="$fixture_root/fake-bin"
          extracted="$fixture_root/extracted"
          adapter_root="$fixture_home/.local/share/picotoopet/research/crawl4ai"
          mkdir -p \
            "$gateway_runtime" \
            "$gateway_root/bin" \
            "$worker_root" \
            "$fake_bin" \
            "$extracted" \
            "$fixture_home/.local/bin"

          git show "$BASELINE_SHA:research_gateway/gateway.py" > "$gateway_runtime/gateway.py"
          git show "$BASELINE_SHA:research_gateway/VERSION" > "$gateway_runtime/VERSION"
          cp "$gateway_runtime/gateway.py" "$fixture_root/baseline-gateway.py"
          printf 'worker-preserve\n' > "$worker_root/fixture-worker-marker.txt"
          printf '#!/bin/bash\nexit 0\n' > "$fixture_home/.local/bin/scrapling-mcp-local"
          chmod 755 "$fixture_home/.local/bin/scrapling-mcp-local"

          cat > "$gateway_root/bin/picotoopet-research-gateway" <<EOF
          #!/bin/bash
          set -euo pipefail
          exec "$(command -v python3)" "$gateway_runtime/gateway.py" "\$@"
          EOF
          chmod 755 "$gateway_root/bin/picotoopet-research-gateway"

          cat > "$fake_bin/mcporter" <<'EOF'
          #!/bin/bash
          # discovery fixture；Scrapling 分支只验证既有只读入口可达，不冒充真实 Crawl4AI。
          set -euo pipefail
          if [[ "${1:-}" == "call" && "${2:-}" == exa.web_search_exa* ]]; then
            printf '%s\n' '{"results":[{"title":"Example Domain","url":"https://example.com/"}]}'
            exit 0
          fi
          if [[ "${1:-}" == "call" && "${2:-}" == "scrapling.get" ]]; then
            printf '%s\n' '# Example Domain' '' 'Scrapling fixture read.'
            exit 0
          fi
          exit 64
          EOF
          chmod 755 "$fake_bin/mcporter"

          tar -xzf \
            artifacts/crawl4ai-research-adapter/PicotooPet-Crawl4AI-Research-Adapter-Mac-arm64.tar.gz \
            -C "$extracted"
          package_root="$extracted/PicotooPet-Crawl4AI-Research-Adapter-Mac-arm64"

          echo "fixture_root=$fixture_root" >> "$GITHUB_OUTPUT"
          echo "fixture_home=$fixture_home" >> "$GITHUB_OUTPUT"
          echo "gateway_root=$gateway_root" >> "$GITHUB_OUTPUT"
          echo "worker_root=$worker_root" >> "$GITHUB_OUTPUT"
          echo "fake_bin=$fake_bin" >> "$GITHUB_OUTPUT"
          echo "adapter_root=$adapter_root" >> "$GITHUB_OUTPUT"
          echo "package_root=$package_root" >> "$GITHUB_OUTPUT"

      - name: Real package install and upgrade compatibility
        shell: bash
        env:
          FIXTURE_HOME: ${{ steps.fixture.outputs.fixture_home }}
          GATEWAY_ROOT: ${{ steps.fixture.outputs.gateway_root }}
          WORKER_ROOT: ${{ steps.fixture.outputs.worker_root }}
          ADAPTER_ROOT: ${{ steps.fixture.outputs.adapter_root }}
          PACKAGE_ROOT: ${{ steps.fixture.outputs.package_root }}
        run: |
          # 首装真实安装 Crawl4AI 0.9.2 + 私有 Playwright Chromium。
          HOME="$FIXTURE_HOME" \
          PICOTOOPET_CRAWL4AI_ROOT="$ADAPTER_ROOT" \
          PICOTOOPET_RESEARCH_INSTALL_ROOT="$GATEWAY_ROOT" \
          PICOTOO_RUNTIME_ROOT_OVERRIDE="$WORKER_ROOT" \
            "$PACKAGE_ROOT/INSTALL_CRAWL4AI_RESEARCH_ADAPTER.command"

          first_version="$($ADAPTER_ROOT/bin/picotoopet-crawl4ai-provider --version)"
          test "$first_version" = "0.9.2"

          # 重复安装只绑定兼容环境，不升级 Crawl4AI，并保留首次 venv ownership。
          HOME="$FIXTURE_HOME" \
          PICOTOOPET_CRAWL4AI_ROOT="$ADAPTER_ROOT" \
          PICOTOOPET_RESEARCH_INSTALL_ROOT="$GATEWAY_ROOT" \
          PICOTOO_RUNTIME_ROOT_OVERRIDE="$WORKER_ROOT" \
            "$PACKAGE_ROOT/INSTALL_CRAWL4AI_RESEARCH_ADAPTER.command"

          second_version="$($ADAPTER_ROOT/bin/picotoopet-crawl4ai-provider --version)"
          test "$second_version" = "$first_version"
          python3 - "$ADAPTER_ROOT/state/install-state.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["created_venv"] is True
          assert payload["crawl4ai_version"] == "0.9.2"
          assert payload["read_only"] is True
          assert payload["chrome_profile_access"] is False
          PY

      - name: Run live static JS failure and metadata fixtures
        shell: bash
        env:
          FIXTURE_HOME: ${{ steps.fixture.outputs.fixture_home }}
          GATEWAY_ROOT: ${{ steps.fixture.outputs.gateway_root }}
          WORKER_ROOT: ${{ steps.fixture.outputs.worker_root }}
          FAKE_BIN: ${{ steps.fixture.outputs.fake_bin }}
          ADAPTER_ROOT: ${{ steps.fixture.outputs.adapter_root }}
          PACKAGE_ROOT: ${{ steps.fixture.outputs.package_root }}
        run: |
          HOME="$FIXTURE_HOME" \
          PATH="$FAKE_BIN:$PATH" \
          PICOTOOPET_CRAWL4AI_ROOT="$ADAPTER_ROOT" \
          PICOTOOPET_RESEARCH_INSTALL_ROOT="$GATEWAY_ROOT" \
          PICOTOO_RUNTIME_ROOT_OVERRIDE="$WORKER_ROOT" \
            "$PACKAGE_ROOT/VERIFY_CRAWL4AI_RESEARCH_ADAPTER.command"

      - name: Run Worker to Gateway to real Crawl4AI contract twice
        shell: bash
        env:
          FIXTURE_HOME: ${{ steps.fixture.outputs.fixture_home }}
          GATEWAY_ROOT: ${{ steps.fixture.outputs.gateway_root }}
          FAKE_BIN: ${{ steps.fixture.outputs.fake_bin }}
        run: |
          # 每次 executor 调用都会启动独立 Gateway subprocess；第二次证明 Gateway 重启后合同仍成立。
          HOME="$FIXTURE_HOME" PATH="$FAKE_BIN:$PATH" PYTHONPATH=src python - "$GATEWAY_ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          from picotoopet_core.research.execution import ResearchGatewayExecutor

          executable = Path(sys.argv[1]) / "bin" / "picotoopet-research-gateway"
          first_executor = ResearchGatewayExecutor(executable=executable)
          first = first_executor.search(query="example domain", limit=1, timeout_seconds=120)
          del first_executor
          second_executor = ResearchGatewayExecutor(executable=executable)
          second = second_executor.search(query="example domain", limit=1, timeout_seconds=120)
          for result in (first, second):
              payload = json.loads(result.output)
              assert payload["schema_version"] == "1.0"
              assert payload["documents"][0]["provider"] == "crawl4ai"
              assert payload["documents"][0]["url"].startswith("https://example.com")
              assert payload["documents"][0]["markdown"].strip()
          print("WORKER_GATEWAY_CRAWL4AI_RESTART_CONTRACT=PASS")
          PY

      - name: Capture live evidence and rollback
        shell: bash
        env:
          FIXTURE_ROOT: ${{ steps.fixture.outputs.fixture_root }}
          FIXTURE_HOME: ${{ steps.fixture.outputs.fixture_home }}
          GATEWAY_ROOT: ${{ steps.fixture.outputs.gateway_root }}
          WORKER_ROOT: ${{ steps.fixture.outputs.worker_root }}
          ADAPTER_ROOT: ${{ steps.fixture.outputs.adapter_root }}
          PACKAGE_ROOT: ${{ steps.fixture.outputs.package_root }}
        run: |
          evidence_root="artifacts/crawl4ai-research-adapter/live-evidence"
          mkdir -p "$evidence_root"
          cp -R "$ADAPTER_ROOT/verification" "$evidence_root/verification"
          cp -R "$ADAPTER_ROOT/logs" "$evidence_root/logs"
          cp "$ADAPTER_ROOT/state/install-state.json" \
            "$evidence_root/install-state-before-rollback.json"

          HOME="$FIXTURE_HOME" \
          PICOTOOPET_CRAWL4AI_ROOT="$ADAPTER_ROOT" \
          PICOTOOPET_RESEARCH_INSTALL_ROOT="$GATEWAY_ROOT" \
          PICOTOO_RUNTIME_ROOT_OVERRIDE="$WORKER_ROOT" \
            "$PACKAGE_ROOT/ROLLBACK_CRAWL4AI_RESEARCH_ADAPTER.command"

          cmp "$GATEWAY_ROOT/runtime/gateway.py" "$FIXTURE_ROOT/baseline-gateway.py"
          test -f "$WORKER_ROOT/fixture-worker-marker.txt"
          test -x "$FIXTURE_HOME/.local/bin/scrapling-mcp-local"
          test ! -e "$ADAPTER_ROOT/bin/picotoopet-crawl4ai-provider"
          test ! -e "$ADAPTER_ROOT/venv"
          cp "$ADAPTER_ROOT/state/install-state.json" \
            "$evidence_root/install-state-after-rollback.json"
          cp -R "$ADAPTER_ROOT/logs" "$evidence_root/logs-after-rollback"
          echo "CRAWL4AI_RESEARCH_ADAPTER_ROLLBACK=PASS"

      - name: Upload Mac arm64 install package and evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Crawl4AI-Research-Adapter-Mac-arm64-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/crawl4ai-research-adapter/PicotooPet-Crawl4AI-Research-Adapter-Mac-arm64.tar.gz
            artifacts/crawl4ai-research-adapter/PicotooPet-Crawl4AI-Research-Adapter-Mac-arm64.tar.gz.sha256.txt
            artifacts/crawl4ai-research-adapter/crawl4ai-research-adapter-build-report.json
            artifacts/crawl4ai-research-adapter/baseline-regression-parity.json
            artifacts/crawl4ai-research-adapter/baseline-known-failures.xml
            artifacts/crawl4ai-research-adapter/feature-full-regression.xml
            artifacts/crawl4ai-research-adapter/live-evidence/**
