name: One-shot fix 2.3.15.1 lint and gateway compatibility

on:
  push:
    branches:
      - feature/phase10d-local-commit-candidate-2.3.15.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/phase10d-local-commit-candidate-2.3.15.1
          fetch-depth: 0

      - name: Apply mechanical lint and compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          execution_path = Path("src/picotoopet_core/providers/commit_execution.py")
          execution = execution_path.read_text(encoding="utf-8")
          execution = execution.replace(
              "from __future__ import annotations\n\nimport ast",
              "from __future__ import annotations\n\nfrom contextlib import suppress\n\nimport ast",
              1,
          )
          execution = execution.replace(
              """        finally:\n            try:\n                index_path.unlink(missing_ok=True)\n            except OSError:\n                pass\n            if worktree_added:\n""",
              """        finally:\n            with suppress(OSError):\n                index_path.unlink(missing_ok=True)\n            if worktree_added:\n""",
              1,
          )
          execution = execution.replace(
              '        return "100644" if change.operation == "add" else (entry[0] if entry is not None else "100644")\n',
              '        return (\n            "100644"\n            if change.operation == "add"\n            else (entry[0] if entry is not None else "100644")\n        )\n',
              1,
          )
          execution = execution.replace(
              """            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n""",
              """            capture_output=True,\n""",
              1,
          )
          execution = execution.replace(
              '        validation_json = json.dumps(result.validation_checks, ensure_ascii=False, separators=(",", ":"))\n',
              '        validation_json = json.dumps(\n            result.validation_checks,\n            ensure_ascii=False,\n            separators=(",", ":"),\n        )\n',
              1,
          )
          execution_path.write_text(execution, encoding="utf-8")

          service_path = Path("src/picotoopet_core/providers/commit_service.py")
          service = service_path.read_text(encoding="utf-8")
          service = service.replace(
              '                    ") VALUES (?, ?, ?, ?, ?, ?, ?, NULL, NULL, ?, ?, ?, ?, NULL, NULL, ?, ?, NULL, ?)",\n',
              '                    ") VALUES (?, ?, ?, ?, ?, ?, ?, NULL, NULL, ?, ?, ?, ?, "\n                    "NULL, NULL, ?, ?, NULL, ?)",\n',
              1,
          )
          service = service.replace(
              '                        json.dumps(preview, ensure_ascii=False, sort_keys=True, separators=(",", ":")),\n',
              '                        json.dumps(\n                            preview,\n                            ensure_ascii=False,\n                            sort_keys=True,\n                            separators=(",", ":"),\n                        ),\n',
              1,
          )
          service = service.replace(
              '            finished_at=(datetime.fromisoformat(row["finished_at"]) if row["finished_at"] else None),\n',
              '            finished_at=(\n                datetime.fromisoformat(row["finished_at"])\n                if row["finished_at"]\n                else None\n            ),\n',
              1,
          )
          service_path.write_text(service, encoding="utf-8")

          gateway_path = Path(
              "windows/desktop/src/PicotooPet.Desktop/Services/IProviderReviewGateway.cs"
          )
          gateway = gateway_path.read_text(encoding="utf-8")
          gateway = gateway.replace(
              """    Task<ProviderCommitCandidateRecord> PrepareCommitAsync(\n        string adoptionCandidateId,\n        string idempotencyKey,\n        CancellationToken cancellationToken);\n\n    Task<ProviderCommitCandidateRecord[]> GetCommitCandidatesAsync(CancellationToken cancellationToken);\n""",
              """    Task<ProviderCommitCandidateRecord> PrepareCommitAsync(\n        string adoptionCandidateId,\n        string idempotencyKey,\n        CancellationToken cancellationToken) =>\n        Task.FromException<ProviderCommitCandidateRecord>(\n            new InvalidOperationException(\n                \"该 Review gateway 未配置 Commit Candidate 写入。\"));\n\n    Task<ProviderCommitCandidateRecord[]> GetCommitCandidatesAsync(\n        CancellationToken cancellationToken) =>\n        Task.FromResult(Array.Empty<ProviderCommitCandidateRecord>());\n""",
              1,
          )
          gateway_path.write_text(gateway, encoding="utf-8")

          Path(".github/workflows/one-shot-fix-23151-lint-gateway.yml").unlink()

      - name: Commit atomic mechanical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: satisfy native lint and WPF gateway compatibility"
          git push origin HEAD:feature/phase10d-local-commit-candidate-2.3.15.1
