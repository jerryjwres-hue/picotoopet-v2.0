name: Maotai v2 Pose Cohesion Fix Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-pose-cohesion-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Apply state-aware body occlusion
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiRasterRenderer.cs")
          text = path.read_text(encoding="utf-8")

          call_anchor = """        ApplyBone(_visuals.TailTip, frame.TailTip);\n\n        ApplyWorkProps(frame.MotionState);"""
          call_replace = """        ApplyBone(_visuals.TailTip, frame.TailTip);\n\n        ApplyPoseCohesion(frame.MotionState);\n        ApplyWorkProps(frame.MotionState);"""
          if call_anchor not in text:
              raise SystemExit("renderer Apply anchor not found")
          text = text.replace(call_anchor, call_replace, 1)

          method_anchor = """    private void ApplyWorkProps(MaotaiMotionState state)\n    {"""
          method_insert = """    private void ApplyPoseCohesion(MaotaiMotionState state)\n    {\n        // Pose occlusion      : work/rest poses tuck the long IK middle segments behind the plush torso.\n        // Contact readability : paws remain fully visible so keyboard/ground contact never looks detached.\n        var hideMiddleSegments = state is\n            MaotaiMotionState.WorkSettle or\n            MaotaiMotionState.WorkTyping or\n            MaotaiMotionState.WorkTired or\n            MaotaiMotionState.Yawn or\n            MaotaiMotionState.WorkAnnoyed or\n            MaotaiMotionState.Recover or\n            MaotaiMotionState.LieDown or\n            MaotaiMotionState.Sleep or\n            MaotaiMotionState.Wake or\n            MaotaiMotionState.GetUp;\n        var segmentOpacity = hideMiddleSegments ? 0.0 : 1.0;\n\n        _visuals.FrontLeftUpper.Element.Opacity  = segmentOpacity;\n        _visuals.FrontLeftLower.Element.Opacity  = segmentOpacity;\n        _visuals.FrontRightUpper.Element.Opacity = segmentOpacity;\n        _visuals.FrontRightLower.Element.Opacity = segmentOpacity;\n        _visuals.HindLeftUpper.Element.Opacity   = segmentOpacity;\n        _visuals.HindLeftLower.Element.Opacity   = segmentOpacity;\n        _visuals.HindRightUpper.Element.Opacity  = segmentOpacity;\n        _visuals.HindRightLower.Element.Opacity  = segmentOpacity;\n\n        _visuals.FrontLeftPaw.Element.Opacity  = 1.0;\n        _visuals.FrontRightPaw.Element.Opacity = 1.0;\n        _visuals.HindLeftPaw.Element.Opacity   = 1.0;\n        _visuals.HindRightPaw.Element.Opacity  = 1.0;\n    }\n\n    private void ApplyWorkProps(MaotaiMotionState state)\n    {"""
          if method_anchor not in text:
              raise SystemExit("renderer work-prop anchor not found")
          text = text.replace(method_anchor, method_insert, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit focused cohesion fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiRasterRenderer.cs
          git diff --cached --check
          git commit -m "fix: hide Maotai folded limb seams behind torso"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
