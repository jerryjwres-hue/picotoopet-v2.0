name: Maotai v2 Compact Run Lanes Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-run-shoulder-lane-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Keep moving paws close to their shoulder lanes
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs")
          text = path.read_text(encoding="utf-8")
          old = """        if (grounded && moving)\n        {\n            // Front-view lane     : preserve a center gap so wide furry silhouettes never cross into an X shape.\n            // Foot-lock priority  : keep the world lock until it reaches the lane edge, then clamp only the visual paw lane.\n            var laneSign      = Math.Sign(shoulderLocalX);\n            var laneClearance = frontLeg ? 7.0 : 6.0;\n            var pawLocalX     = pawWorldX - _locomotion.PositionX;\n            pawLocalX = laneSign < 0.0\n                ? Math.Min(pawLocalX, -laneClearance)\n                : Math.Max(pawLocalX, laneClearance);\n            pawWorldX = _locomotion.PositionX + pawLocalX;\n        }"""
          new = """        if (grounded && moving)\n        {\n            // Front-view lane    : lateral travel belongs to the root; paws only make a compact trot around their own shoulder.\n            // Seam prevention    : this keeps each stretched furry leg near vertical, preventing center-crossing X silhouettes.\n            var laneRadius = frontLeg ? 4.5 : 4.0;\n            var pawLocalX  = pawWorldX - _locomotion.PositionX;\n            pawLocalX = Math.Clamp(\n                pawLocalX,\n                shoulderLocalX - laneRadius,\n                shoulderLocalX + laneRadius);\n            pawWorldX = _locomotion.PositionX + pawLocalX;\n        }"""
          if old not in text:
              raise SystemExit("existing run-lane clamp anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit compact front-view gait lanes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs
          git diff --cached --check
          git commit -m "fix: keep Maotai running legs in compact shoulder lanes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
