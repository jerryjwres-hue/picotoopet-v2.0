name: P0 Mac Unattended Readiness

on:
  push:
    branches:
      - test/p0-mac-unattended-readiness-v1
    paths:
      - ".github/workflows/p0-mac-unattended-readiness.yml"
      - "tests/p0_mac_unattended/**"
      - "scripts/mac/phase23-worker/**"
      - "deploy/macos/phase23-worker/**"
      - "docs/p0_mac_unattended/**"
  pull_request:
    paths:
      - ".github/workflows/p0-mac-unattended-readiness.yml"
      - "tests/p0_mac_unattended/**"
      - "scripts/mac/phase23-worker/**"
      - "deploy/macos/phase23-worker/**"
      - "docs/p0_mac_unattended/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-mac-unattended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos-readiness:
    name: Native macOS unattended bounded smoke
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runtime (CI only)
        shell: bash
        run: |
          python -m pip install -e . pytest==9.1.1 ruff==0.16.1
      - name: Verify native macOS and source syntax
        shell: bash
        run: |
          sw_vers
          uname -m
          python --version
          test "$(uname -s)" = "Darwin"
          bash -n deploy/macos/phase23-worker/worker-lib.sh
          plutil -lint deploy/macos/com.picotoopet.mac-core.plist
          plutil -lint deploy/macos/com.picotoopet.health-supervisor.plist
          python -m compileall -q tests/p0_mac_unattended
          ruff check tests/p0_mac_unattended
      - name: Run bounded restart, queue, model and reconnect smoke
        shell: bash
        run: |
          mkdir -p artifacts/p0-mac-unattended
          python -m pytest -q tests/p0_mac_unattended             --junitxml=artifacts/p0-mac-unattended/junit.xml
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-mac-unattended-evidence-${{ github.run_id }}
          path: artifacts/p0-mac-unattended/
          if-no-files-found: warn
          retention-days: 14
