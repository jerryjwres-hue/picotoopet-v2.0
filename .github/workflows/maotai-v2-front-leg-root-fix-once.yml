name: Maotai v2 Front Leg Root Fix Once

on:
  pull_request:
    paths:
      - .github/workflows/maotai-v2-front-leg-root-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Move only rendered front-leg roots into torso fur
        shell: python
        run: |
          from pathlib import Path

          path = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiRasterRenderer.cs")
          text = path.read_text(encoding="utf-8")

          old_calls = '''        ApplyContinuousLeg(_visuals.FrontLeftUpper, _visuals.FrontLeftLower, frame.FrontLeftUpper, frame.FrontLeftPaw);\n        ApplyFrontPaw(_visuals.FrontLeftPaw, frame.FrontLeftPaw, frame.MotionState);\n        ApplyContinuousLeg(_visuals.FrontRightUpper, _visuals.FrontRightLower, frame.FrontRightUpper, frame.FrontRightPaw);\n        ApplyFrontPaw(_visuals.FrontRightPaw, frame.FrontRightPaw, frame.MotionState);'''
          new_calls = '''        ApplyContinuousLeg(\n            _visuals.FrontLeftUpper,\n            _visuals.FrontLeftLower,\n            frame.FrontLeftUpper,\n            frame.FrontLeftPaw,\n            visualRootYOffset: -10.0,\n            maxScaleY: 1.44);\n        ApplyFrontPaw(_visuals.FrontLeftPaw, frame.FrontLeftPaw, frame.MotionState);\n        ApplyContinuousLeg(\n            _visuals.FrontRightUpper,\n            _visuals.FrontRightLower,\n            frame.FrontRightUpper,\n            frame.FrontRightPaw,\n            visualRootYOffset: -10.0,\n            maxScaleY: 1.44);\n        ApplyFrontPaw(_visuals.FrontRightPaw, frame.FrontRightPaw, frame.MotionState);'''
          if text.count(old_calls) != 1:
              raise SystemExit("front leg render call anchor mismatch")
          text = text.replace(old_calls, new_calls, 1)

          old_helper = '''    private static void ApplyContinuousLeg(\n        MaotaiRasterPart upper,\n        MaotaiRasterPart lower,\n        in MaotaiBonePose upperPose,\n        in MaotaiBonePose pawPose)\n    {\n        var dx       = pawPose.X - upperPose.X;\n        var dy       = pawPose.Y - upperPose.Y;\n        var distance = Math.Sqrt((dx * dx) + (dy * dy));\n        var angleDeg = Math.Atan2(dy, dx) * 180.0 / Math.PI;\n\n        // Visual reach       : use the actual post-pivot PNG reach and overlap the paw by a few pixels.\n        // Width compression  : a slightly slimmer furry silhouette avoids the rectangular two-bone pillar look.\n        var pivotY      = upper.Element.RenderTransformOrigin.Y;\n        var visualReach = Math.Max(1.0, upper.Element.Height * (1.0 - pivotY));\n        var scaleY      = Math.Clamp((distance + 4.0) / visualReach, 0.72, 1.30);\n        upper.Apply(\n            upperPose.X,\n            upperPose.Y,\n            MaotaiRasterAxis.LegRotationFromIkDegrees(angleDeg),\n            scaleX: 0.86,\n            scaleY: scaleY);\n\n        lower.Element.Opacity = 0.0;\n    }'''
          new_helper = '''    private static void ApplyContinuousLeg(\n        MaotaiRasterPart upper,\n        MaotaiRasterPart lower,\n        in MaotaiBonePose upperPose,\n        in MaotaiBonePose pawPose,\n        double visualRootYOffset = 0.0,\n        double maxScaleY = 1.30)\n    {\n        var visualRootY = upperPose.Y + visualRootYOffset;\n        var dx          = pawPose.X - upperPose.X;\n        var dy          = pawPose.Y - visualRootY;\n        var distance    = Math.Sqrt((dx * dx) + (dy * dy));\n        var angleDeg    = Math.Atan2(dy, dx) * 180.0 / Math.PI;\n\n        // Visual root        : front-leg art starts higher inside torso fur; Motion Engine shoulder/foot-lock coordinates stay untouched.\n        // Visual reach       : use the post-pivot PNG reach and overlap the paw by a few pixels so no white socket ring remains visible.\n        var pivotY      = upper.Element.RenderTransformOrigin.Y;\n        var visualReach = Math.Max(1.0, upper.Element.Height * (1.0 - pivotY));\n        var scaleY      = Math.Clamp((distance + 4.0) / visualReach, 0.72, maxScaleY);\n        upper.Apply(\n            upperPose.X,\n            visualRootY,\n            MaotaiRasterAxis.LegRotationFromIkDegrees(angleDeg),\n            scaleX: 0.86,\n            scaleY: scaleY);\n\n        lower.Element.Opacity = 0.0;\n    }'''
          if text.count(old_helper) != 1:
              raise SystemExit("continuous leg helper anchor mismatch")
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text, encoding="utf-8")

      - name: Verify renderer keeps motion physics untouched
        shell: python
        run: |
          from pathlib import Path

          text = Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiRasterRenderer.cs").read_text(encoding="utf-8")
          required = [
              "visualRootYOffset: -10.0",
              "maxScaleY: 1.44",
              "var visualRootY = upperPose.Y + visualRootYOffset;",
              "Motion Engine shoulder/foot-lock coordinates stay untouched",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"missing front-leg visual-root invariants: {missing}")
          if "frontLeft = BuildLockedLeg" not in Path("windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiMotionEngine.cs").read_text(encoding="utf-8"):
              raise SystemExit("Motion Engine leg ownership changed unexpectedly")

      - name: Commit front-leg visual-root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/desktop/src/PicotooPet.Desktop/Views/Controls/MaotaiMotion/MaotaiRasterRenderer.cs
          git diff --cached --check
          git commit -m "fix: bury Maotai front-leg roots inside torso fur"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
