name: Phase 2.3.16.1 exact version patch once

on:
  push:
    branches:
      - feature/platform-automation-foundation-2.3.16.1
    paths:
      - .github/workflows/phase23161-version-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/platform-automation-foundation-2.3.16.1
          fetch-depth: 0
      - name: Replace only the stale product-version assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/contract/test_phase23_mac_delta_source.py")
          text = path.read_text(encoding="utf-8")
          old = 'assert __version__ == "2.3.15.1"'
          new = 'assert __version__ == "2.3.16.1"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale version assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/phase23161-version-fix-once.yml").unlink()
          PY
      - name: Commit exact patch and self-delete
        shell: bash
        run: |
          git config user.name "PicotooPet CI"
          git config user.email "picotoopet@localhost"
          git add tests/contract/test_phase23_mac_delta_source.py .github/workflows/phase23161-version-fix-once.yml
          git commit -m "test: advance remaining Mac version contract to 2.3.16.1"
          git push origin HEAD:feature/platform-automation-foundation-2.3.16.1
