name: P0-Q2 Read-Only Visual Observation Windows
on:
  push:
    branches: [feature/p0q2-web-visual-critic-20261029]
    paths:
      - tools/p0_visual_review/**
      - windows/desktop/tests/PicotooPet.QualityObservation.SmokeTests/**
      - .github/workflows/p0-q2-visual-review-native.yml
  pull_request:
    paths:
      - tools/p0_visual_review/**
      - windows/desktop/tests/PicotooPet.QualityObservation.SmokeTests/**
      - .github/workflows/p0-q2-visual-review-native.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-q2-visual-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  read-only-windows:
    name: Native Windows 2025 observer + immutable synthetic media
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json
      - name: Build focused tool and execute contract negatives (no GPU)
        shell: pwsh
        run: |
          dotnet build tools/p0_visual_review/PicotooPet.VisualReview.csproj -c Release --warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/desktop/tests/PicotooPet.QualityObservation.SmokeTests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Resolve CPU ffmpeg and ffprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)) {
            throw 'P0Q2_FFMPEG_UNAVAILABLE'
          }
      - name: Exercise exact 3-clip CPU-only audit and source tamper failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'p0q2-synthetic-webms'
          $out = Join-Path $env:RUNNER_TEMP 'p0q2-synthetic-evidence'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $shots = @()
          foreach ($i in 1..3) {
            $file = Join-Path $root "shot$i.webm"
            & ffmpeg -hide_banner -loglevel error -nostdin -f lavfi -i "color=c=white:s=320x180:r=24:d=4" -an -c:v libvpx-vp9 -b:v 250k -y $file
            if ($LASTEXITCODE) { throw "P0Q2_SYNTHETIC_MEDIA_FAILED_$i" }
            $shots += [ordered]@{
              order = $i
              shot_id = "shot$i"
              task_id = "task$i"
              relative_path = "shot$i.webm"
              sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = (Get-Item -LiteralPath $file).Length
              expected_frames = 96
              expected_duration_ms = 4000
              action = "Synthetic color fixture $i, not pet film"
            }
          }
          $manifest = Join-Path $env:RUNNER_TEMP 'p0q2-input.json'
          @{ schema_version = 'visual_review.input.v1'; job_id = '64695948-fb1a-4793-815f-3f6ad4d4d536'; shots = $shots } |
            ConvertTo-Json -Depth 9 | Set-Content -LiteralPath $manifest -Encoding utf8
          $ffprobe = (Get-Command ffprobe.exe).Source
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          dotnet run --no-build --project tools/p0_visual_review/PicotooPet.VisualReview.csproj -c Release -- $manifest $root $out $ffprobe $ffmpeg
          if ($LASTEXITCODE) { throw 'P0Q2_CONTACT_SHEET_FAILED' }
          $report = Get-Content -LiteralPath (Join-Path $out 'report.json') -Raw | ConvertFrom-Json
          if ($report.schema_version -ne 'visual_review.v1' -or $report.status -ne 'ADVISORY_REVIEW' -or
              $report.shots.Count -ne 3 -or $report.model_state -ne 'NOT_REQUESTED' -or
              @(Get-ChildItem -LiteralPath (Join-Path $out 'frames') -Filter '*.png').Count -ne 9) {
            throw 'P0Q2_GRID_INVALID'
          }
          $sheetHash = (Get-FileHash -LiteralPath (Join-Path $out 'contact_sheet_3x3.png') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sheetHash -ne $report.contact_sheet_sha256) { throw 'P0Q2_CONTACT_SHA_MISMATCH' }
          foreach ($shot in $shots) {
            if ((Get-FileHash -LiteralPath (Join-Path $root $shot.relative_path) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $shot.sha256) {
              throw 'P0Q2_SOURCE_CHANGED'
            }
          }
          Write-Host 'P0_Q2_NATIVE_CPU_WEBM=PASS; SOURCE_HASH=PASS; CONTACT_SHEET=PASS; GPU_POST=0'
          $shots[0].sha256 = ('0' * 64)
          $bad = Join-Path $env:RUNNER_TEMP 'p0q2-tampered.json'
          @{ schema_version = 'visual_review.input.v1'; job_id = '64695948-fb1a-4793-815f-3f6ad4d4d536'; shots = $shots } |
            ConvertTo-Json -Depth 9 | Set-Content -LiteralPath $bad -Encoding utf8
          $reject = Join-Path $env:RUNNER_TEMP 'p0q2-tamper-evidence'
          dotnet run --no-build --project tools/p0_visual_review/PicotooPet.VisualReview.csproj -c Release -- $bad $root $reject $ffprobe $ffmpeg
          if ($LASTEXITCODE -ne 2) { throw 'P0Q2_SOURCE_TAMPER_NOT_REJECTED' }
          if ((Get-Content -LiteralPath (Join-Path $reject 'report.json') -Raw | ConvertFrom-Json).status -ne 'UNVERIFIED') {
            throw 'P0Q2_TAMPER_NOT_UNVERIFIED'
          }
          Write-Host 'P0_Q2_TAMPER_UNVERIFIED=PASS; REAL_USER_PET_ACCEPT=UNVERIFIED'
      - name: Store synthetic-only audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: P0Q2-Synthetic-Audit-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/p0q2-synthetic-evidence/report.json
            ${{ runner.temp }}/p0q2-synthetic-evidence/contact_sheet_3x3.png
