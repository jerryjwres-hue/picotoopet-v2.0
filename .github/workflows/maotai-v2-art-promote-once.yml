name: Maotai v2 Art Promote Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/maotai-v2-art-promote-once.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore and promote 17 formal Maotai assets
        shell: bash
        run: |
          set -euo pipefail
          python docs/art/maotai-v2/staging/2026-08-18/restore_batch1_missing17.py \
            docs/art/maotai-v2/staging/2026-08-18/batch1_missing17.mtr.b85 \
            "$RUNNER_TEMP/maotai-restored"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import os

          src = Path(os.environ['RUNNER_TEMP']) / 'maotai-restored'
          dst = Path('windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2')
          dst.mkdir(parents=True, exist_ok=True)

          target = {
              'head.png': (156, 140),
              'muzzle.png': (92, 68),
              'front_left_upper.png': (68, 92),
              'front_left_lower.png': (64, 88),
              'front_right_upper.png': (68, 92),
              'front_right_lower.png': (64, 88),
              'hind_left_upper.png': (76, 88),
              'hind_left_lower.png': (72, 84),
              'hind_right_upper.png': (76, 88),
              'hind_right_lower.png': (72, 84),
              'tail_base.png': (96, 84),
              'tail_mid.png': (92, 76),
              'tail_tip.png': (84, 68),
              'headphone_band.png': (144, 96),
              'headphone_left.png': (56, 68),
              'headphone_right.png': (56, 68),
              'laptop.png': (184, 116),
          }

          restored = sorted(p.name for p in src.glob('*.png'))
          if sorted(target) != restored:
              raise SystemExit(f'checkpoint set mismatch: restored={restored}')

          for name, size in target.items():
              img = Image.open(src / name).convert('RGBA')
              if img.size != size:
                  img = img.resize(size, Image.Resampling.NEAREST)
              alpha = img.getchannel('A')
              if alpha.getbbox() is None:
                  raise SystemExit(f'{name}: empty alpha')
              draw = ImageDraw.Draw(alpha)
              draw.line((0, 0, size[0]-1, 0), fill=0)
              draw.line((0, size[1]-1, size[0]-1, size[1]-1), fill=0)
              draw.line((0, 0, 0, size[1]-1), fill=0)
              draw.line((size[0]-1, 0, size[0]-1, size[1]-1), fill=0)
              img.putalpha(alpha)
              if img.size != size or alpha.getbbox() is None:
                  raise SystemExit(f'{name}: validation failed')
              if any(alpha.getpixel((x, 0)) for x in range(size[0])) or any(alpha.getpixel((x, size[1]-1)) for x in range(size[0])):
                  raise SystemExit(f'{name}: alpha touches horizontal border')
              if any(alpha.getpixel((0, y)) for y in range(size[1])) or any(alpha.getpixel((size[0]-1, y)) for y in range(size[1])):
                  raise SystemExit(f'{name}: alpha touches vertical border')
              img.save(dst / name, 'PNG', optimize=True, compress_level=9)
              print(f'PROMOTED {name} {size}')
          PY

      - name: Commit promoted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/*.png
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'art: promote Maotai v2 missing-17 raster checkpoint'
          git push origin HEAD:feature/maotai-natural-motion-v2
