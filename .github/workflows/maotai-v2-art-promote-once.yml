name: Maotai v2 Art Promote Once

on:
  push:
    branches:
      - feature/maotai-natural-motion-v2
    paths:
      - .github/workflows/maotai-v2-art-promote-once.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore and promote 17 formal Maotai assets
        shell: bash
        run: |
          set -euo pipefail
          python docs/art/maotai-v2/staging/2026-08-18/restore_batch1_missing17.py \
            docs/art/maotai-v2/staging/2026-08-18/batch1_missing17.mtr.b85 \
            "$RUNNER_TEMP/maotai-restored"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          src = Path(r'${{ runner.temp }}') / 'maotai-restored'
          dst = Path('windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2')
          dst.mkdir(parents=True, exist_ok=True)

          target = {
              'head.png': (156, 140),
              'muzzle.png': (92, 68),
              'front_left_upper.png': (68, 92),
              'front_left_lower.png': (64, 88),
              'front_right_upper.png': (68, 92),
              'front_right_lower.png': (64, 88),
              'hind_left_upper.png': (76, 88),
              'hind_left_lower.png': (72, 84),
              'hind_right_upper.png': (76, 88),
              'hind_right_lower.png': (72, 84),
              'tail_base.png': (96, 84),
              'tail_mid.png': (92, 76),
              'tail_tip.png': (84, 68),
              'headphone_band.png': (144, 96),
              'headphone_left.png': (56, 68),
              'headphone_right.png': (56, 68),
              'laptop.png': (184, 116),
          }

          restored = sorted(p.name for p in src.glob('*.png'))
          if sorted(target) != restored:
              raise SystemExit(f'checkpoint set mismatch: restored={restored}')

          for name, size in target.items():
              img = Image.open(src / name).convert('RGBA')
              if img.size != size:
                  img = img.resize(size, Image.Resampling.NEAREST)
              a = np.array(img.getchannel('A'))
              if not np.any(a):
                  raise SystemExit(f'{name}: empty alpha')
              rgba = np.array(img)
              rgba[0, :, 3] = 0
              rgba[-1, :, 3] = 0
              rgba[:, 0, 3] = 0
              rgba[:, -1, 3] = 0
              img = Image.fromarray(rgba, 'RGBA')
              if img.size != size:
                  raise SystemExit(f'{name}: wrong size {img.size} != {size}')
              a = np.array(img.getchannel('A'))
              if max(a[0].max(), a[-1].max(), a[:,0].max(), a[:,-1].max()) != 0:
                  raise SystemExit(f'{name}: alpha touches outer border')
              img.save(dst / name, 'PNG', optimize=True, compress_level=9)
              print(f'PROMOTED {name} {size}')
          PY

      - name: Commit promoted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/*.png
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'art: promote Maotai v2 missing-17 raster checkpoint'
          git push origin HEAD:feature/maotai-natural-motion-v2
