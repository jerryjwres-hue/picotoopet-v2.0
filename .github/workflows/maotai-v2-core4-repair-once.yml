name: Maotai v2 Core4 Repair Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/maotai-v2-core4-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/maotai-natural-motion-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore clean core-4 assets and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, struct, zlib
          from pathlib import Path
          from PIL import Image, ImageDraw

          pack = Path('docs/art/maotai-v2/staging/2026-08-18/core4_clean16.mtr.b85')
          raw = memoryview(zlib.decompress(base64.b85decode(pack.read_text(encoding='utf-8').strip().encode('ascii'))))
          pos = 0
          if bytes(raw[:4]) != b'MTR1':
              raise SystemExit('invalid MTR1 core4 pack')
          pos = 4
          count = struct.unpack_from('>H', raw, pos)[0]; pos += 2
          if count != 4:
              raise SystemExit(f'expected 4 core assets, got {count}')

          dst = Path('windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2')
          expected = {
              'torso_neutral.png': (184, 156),
              'torso_crouch.png': (192, 144),
              'torso_stretch.png': (180, 172),
              'chest_fur.png': (124, 104),
          }
          restored = []
          for _ in range(count):
              nlen = struct.unpack_from('>H', raw, pos)[0]; pos += 2
              name = bytes(raw[pos:pos+nlen]).decode('utf-8'); pos += nlen
              width, height, pcount = struct.unpack_from('>HHB', raw, pos); pos += 5
              plen = pcount * 4
              palette = bytes(raw[pos:pos+plen]); pos += plen
              ilen = struct.unpack_from('>I', raw, pos)[0]; pos += 4
              indices = bytes(raw[pos:pos+ilen]); pos += ilen
              if name not in expected or (width, height) != expected[name] or ilen != width * height:
                  raise SystemExit(f'core4 contract mismatch: {name} {(width,height)} len={ilen}')
              pal = [palette[i:i+4] for i in range(0, len(palette), 4)]
              rgba = bytearray(width * height * 4)
              for i, idx in enumerate(indices):
                  rgba[i*4:i*4+4] = pal[idx]
              img = Image.frombytes('RGBA', (width, height), bytes(rgba))
              alpha = img.getchannel('A')
              draw = ImageDraw.Draw(alpha)
              draw.rectangle((0, 0, width-1, 1), fill=0)
              draw.rectangle((0, height-2, width-1, height-1), fill=0)
              draw.rectangle((0, 0, 1, height-1), fill=0)
              draw.rectangle((width-2, 0, width-1, height-1), fill=0)
              if alpha.getbbox() is None:
                  raise SystemExit(f'{name}: empty alpha')
              img.putalpha(alpha)
              path = dst / name
              img.save(path, 'PNG', optimize=True, compress_level=9)
              check = Image.open(path).convert('RGBA')
              bbox = check.getchannel('A').getbbox()
              if bbox is None:
                  raise SystemExit(f'{name}: empty after save')
              left, top, right, bottom = bbox
              if not (left >= 2 and top >= 2 and right - 1 <= width - 3 and bottom - 1 <= height - 3):
                  raise SystemExit(f'{name}: bad safety bbox {bbox}')
              restored.append(name)
              print(f'RESTORED {name} {check.size} bbox={bbox}')
          if sorted(restored) != sorted(expected):
              raise SystemExit(f'core4 set mismatch: {restored}')
          PY

      - name: Commit repaired core-4 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_neutral.png \
                  windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_crouch.png \
                  windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/torso_stretch.png \
                  windows/desktop/src/PicotooPet.Desktop/Assets/Maotai/V2/chest_fur.png
          git commit -m 'art: restore clean Maotai v2 torso and chest sources'
          git push origin HEAD:feature/maotai-natural-motion-v2
