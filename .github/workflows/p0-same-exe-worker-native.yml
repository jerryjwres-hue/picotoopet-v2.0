name: P0 Same EXE Worker Native
on:
  push:
    branches: [integration/win-only-real-video-p0-v1]
    paths:
      - windows/desktop/**
      - .github/workflows/p0-same-exe-worker-native.yml
  pull_request:
    paths:
      - windows/desktop/**
      - .github/workflows/p0-same-exe-worker-native.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-sameexe-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json
      - name: Build same-EXE linked recovery harness (no GPU or installer)
        shell: pwsh
        run: |
          dotnet build windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release --warnaserror
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Codex recovery + Core failure contracts + exact host boundary
        shell: pwsh
        run: |
          dotnet run --no-build --project windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # ── Candidate P0 acceptance: execute Codex independent matrix on the same frozen SHA. ──
      - name: Independent 28-case three-shot admission and journal matrix (no GPU)
        shell: pwsh
        run: |
          dotnet run --no-build --project windows/desktop/tests/PicotooPet.MediaWorker.SmokeTests -c Release -- --independent-three-shot-gate-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Existing GUI must not own GPU, QA receipt remains authoritative
        shell: pwsh
        run: |
          dotnet run --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests -c Release -- --goal-production-autopilot-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests -c Release -- --goal-final-video-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
