name: Maotai v2 Runner Repair Once

on:
  push:
    branches:
      - feature/maotai-natural-motion-v2
    paths:
      - .github/workflows/maotai-v2-runner-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Maotai branch
        uses: actions/checkout@v6
        with:
          ref: feature/maotai-natural-motion-v2
          fetch-depth: 0

      - name: Repair runner contracts and structural gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner_path = Path("windows/desktop/tools/maotai_v2_assets/run_maotai_v2_comfyui_jobs.py")
          png_path    = Path("windows/desktop/tools/maotai_v2_assets/maotai_png_validation.py")

          runner = runner_path.read_text(encoding="utf-8")
          png    = png_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              # Fail closed          : a changed source layout must stop this one-shot repair instead of guessing.
              if old not in text:
                  raise SystemExit(f"repair marker missing: {label}")
              return text.replace(old, new, 1)

          runner = replace_once(
              runner,
              '''    rmbg = title_to_node.get("MAOTAI_RMBG")
              if rmbg is not None:
                  rmbg_id, _ = rmbg
                  bindings["rmbg"] = {
                      "node": rmbg_id,
                      "background_input": "background",
                      "model_input": "model",
                      "model": "BiRefNet-general",
                  }
          ''',
              '''    rmbg = title_to_node.get("MAOTAI_RMBG")
              if rmbg is not None:
                  rmbg_id, rmbg_node = rmbg
                  if rmbg_node.get("class_type") != "BiRefNetRMBG":
                      raise ValueError("MAOTAI_RMBG auto-bind node must be BiRefNetRMBG")
                  _require_node_input(workflow, rmbg_id, "background", "MAOTAI_RMBG")
                  _require_node_input(workflow, rmbg_id, "model", "MAOTAI_RMBG")
                  bindings["rmbg"] = {
                      "node": rmbg_id,
                      "background_input": "background",
                      "model_input": "model",
                      "model": "Lucida",
                  }
          ''',
              "RMBG auto-bind",
          )

          helpers_marker = '''def prepare_reference_uploads(
          '''
          helpers = '''def build_multipart_image_upload(
              image_path: Path | str,
              *,
              subfolder: str = _DEFAULT_REFERENCE_SUBFOLDER,
              boundary: str | None = None,
          ) -> tuple[bytes, str]:
              """构造 ComfyUI 官方 `/upload/image` multipart；纯函数便于合同测试和审计。"""
              path       = Path(image_path)
              file_name  = _validate_reference_png(path)
              normalized = _normalize_reference_subfolder(subfolder)
              actual_boundary = boundary or f"----PicotooPetMaotai{uuid.uuid4().hex}"
              body = _encode_multipart_form_data(
                  actual_boundary,
                  fields={
                      "type": "input",
                      "subfolder": normalized,
                      "overwrite": "true",
                  },
                  file_field="image",
                  file_name=file_name,
                  file_bytes=path.read_bytes(),
              )
              return body, f"multipart/form-data; boundary={actual_boundary}"


          def normalize_uploaded_input_name(
              payload: dict[str, Any],
              *,
              expected_name: str,
              expected_subfolder: str,
          ) -> str:
              """严格验证 ComfyUI 上传回执，避免 LoadImage 被静默重命名或切换到 output。"""
              if not isinstance(payload, dict):
                  raise ValueError("ComfyUI upload response must be an object")
              name      = payload.get("name")
              subfolder = payload.get("subfolder", "")
              image_type = payload.get("type")
              normalized_expected = _normalize_reference_subfolder(expected_subfolder)
              if name != expected_name:
                  raise ValueError(
                      f"ComfyUI upload response name mismatch: expected={expected_name!r}, actual={name!r}"
                  )
              if not isinstance(subfolder, str):
                  raise ValueError("ComfyUI upload response subfolder is invalid")
              normalized_subfolder = _normalize_reference_subfolder(subfolder)
              if normalized_subfolder != normalized_expected:
                  raise ValueError(
                      "ComfyUI upload response subfolder mismatch: "
                      f"expected={normalized_expected!r}, actual={normalized_subfolder!r}"
                  )
              if image_type != "input":
                  raise ValueError(
                      f"ComfyUI upload response type must be 'input', actual={image_type!r}"
                  )
              return (
                  f"{normalized_subfolder}/{name}"
                  if normalized_subfolder
                  else str(name)
              )


          def prepare_reference_uploads(
          '''
          runner = replace_once(runner, helpers_marker, helpers, "reference helper insertion")

          old_prepare = '''def prepare_reference_uploads(
              plan: dict[str, Any],
              reference_root: Path | str,
              client: "ComfyUiLocalClient",
              *,
              subfolder: str = _DEFAULT_REFERENCE_SUBFOLDER,
          ) -> dict[str, str]:
              """验证并上传 art plan 实际使用的参考图；返回可直接写入 LoadImage.image 的值。"""
              root       = Path(reference_root).resolve()
              normalized = _normalize_reference_subfolder(subfolder)
              uploaded: dict[str, str] = {}
              for reference in _required_primary_references(plan):
                  path = (root / reference).resolve()
                  try:
                      path.relative_to(root)
                  except ValueError as error:
                      raise ValueError(f"reference path escapes reference root: {reference}") from error
                  _validate_reference_png(path)
                  uploaded[reference] = client.upload_input_image(
                      path,
                      subfolder=normalized,
                  )
              return uploaded
          '''
          new_prepare = '''def prepare_reference_uploads(
              plan: dict[str, Any],
              reference_root: Path | str,
              client: "ComfyUiLocalClient",
              *,
              subfolder: str = _DEFAULT_REFERENCE_SUBFOLDER,
          ) -> dict[str, str]:
              """全部参考图先本地预检，再开始上传；任一缺失时保持零网络副作用。"""
              root       = Path(reference_root).resolve()
              normalized = _normalize_reference_subfolder(subfolder)
              prepared: list[tuple[str, Path]] = []
              for reference in _required_primary_references(plan):
                  path = (root / reference).resolve()
                  try:
                      path.relative_to(root)
                  except ValueError as error:
                      raise ValueError(f"reference path escapes reference root: {reference}") from error
                  _validate_reference_png(path)
                  prepared.append((reference, path))

              uploaded: dict[str, str] = {}
              for reference, path in prepared:
                  uploaded[reference] = client.upload_input_image(
                      path,
                      subfolder=normalized,
                  )
              return uploaded
          '''
          runner = replace_once(runner, old_prepare, new_prepare, "reference preflight")

          old_materialize = '''    archive     = Path(archive_path)
              destination = Path(destination_root).resolve()
              destination.mkdir(parents=True, exist_ok=True)
              required    = _required_primary_references(plan)
              found: dict[str, zipfile.ZipInfo] = {}

              with zipfile.ZipFile(archive, "r") as bundle:
                  for info in bundle.infolist():
                      if info.is_dir():
                          continue
                      member_path = _validate_zip_member_path(info.filename)
                      basename    = member_path.name
                      if basename not in required:
                          continue
                      if basename in found:
                          raise ValueError(f"duplicate reference in archive: {basename}")
                      _validate_zip_reference_info(
                          info,
                          basename,
                          max_reference_bytes=max_reference_bytes,
                      )
                      found[basename] = info

                  missing = [reference for reference in required if reference not in found]
                  if missing:
                      raise ValueError("reference archive is missing required PNG(s): " + ", ".join(missing))

                  for reference in required:
                      info       = found[reference]
                      output     = (destination / reference).resolve()
                      try:
                          output.relative_to(destination)
                      except ValueError as error:
                          raise ValueError(f"reference output escapes destination: {reference}") from error
                      payload = bundle.read(info)
                      if len(payload) > max_reference_bytes:
                          raise ValueError(f"reference size exceeds limit after extract: {reference}")
                      output.write_bytes(payload)
                      _validate_reference_png(output)

              return destination
          '''
          new_materialize = '''    archive     = Path(archive_path)
              destination = Path(destination_root).resolve()
              required    = _required_primary_references(plan)
              found: dict[str, zipfile.ZipInfo] = {}
              payloads: dict[str, bytes]         = {}

              with zipfile.ZipFile(archive, "r") as bundle:
                  for info in bundle.infolist():
                      if info.is_dir():
                          continue
                      member_path = _validate_zip_member_path(info.filename)
                      basename    = member_path.name
                      if basename not in required:
                          continue
                      if basename in found:
                          raise ValueError(f"duplicate reference in archive: {basename}")
                      _validate_zip_reference_info(
                          info,
                          basename,
                          max_reference_bytes=max_reference_bytes,
                      )
                      found[basename] = info

                  missing = [reference for reference in required if reference not in found]
                  if missing:
                      raise ValueError("reference archive is missing required PNG(s): " + ", ".join(missing))

                  # Archive preflight    : read and validate every required payload before touching destination.
                  for reference in required:
                      payload = bundle.read(found[reference])
                      if len(payload) > max_reference_bytes:
                          raise ValueError(f"reference size exceeds limit after extract: {reference}")
                      if not payload.startswith(_PNG_SIGNATURE):
                          raise ValueError(f"reference image is not a valid PNG payload: {reference}")
                      payloads[reference] = payload

              destination.mkdir(parents=True, exist_ok=True)
              for reference in required:
                  output = (destination / reference).resolve()
                  try:
                      output.relative_to(destination)
                  except ValueError as error:
                      raise ValueError(f"reference output escapes destination: {reference}") from error
                  output.write_bytes(payloads[reference])
                  _validate_reference_png(output)

              return destination
          '''
          runner = replace_once(runner, old_materialize, new_materialize, "zip fail-closed preflight")

          old_upload = '''        path       = Path(image_path)
                  file_name  = _validate_reference_png(path)
                  normalized = _normalize_reference_subfolder(subfolder)
                  boundary   = f"----PicotooPetMaotai{uuid.uuid4().hex}"
                  body       = _encode_multipart_form_data(
                      boundary,
                      fields={
                          "type": "input",
                          "subfolder": normalized,
                          "overwrite": "true",
                      },
                      file_field="image",
                      file_name=file_name,
                      file_bytes=path.read_bytes(),
                  )
                  payload = self._request_multipart_json(
                      "/upload/image",
                      body,
                      f"multipart/form-data; boundary={boundary}",
                  )
                  uploaded_name = payload.get("name")
                  uploaded_sub  = payload.get("subfolder", normalized)
                  if not isinstance(uploaded_name, str) or not uploaded_name:
                      raise ValueError("ComfyUI upload response is missing image name")
                  if not isinstance(uploaded_sub, str):
                      raise ValueError("ComfyUI upload response has invalid subfolder")
                  uploaded_sub = _normalize_reference_subfolder(uploaded_sub)
                  if uploaded_sub:
                      return f"{uploaded_sub}/{uploaded_name}"
                  return uploaded_name
          '''
          new_upload = '''        path       = Path(image_path)
                  file_name  = _validate_reference_png(path)
                  normalized = _normalize_reference_subfolder(subfolder)
                  body, content_type = build_multipart_image_upload(
                      path,
                      subfolder=normalized,
                  )
                  payload = self._request_multipart_json(
                      "/upload/image",
                      body,
                      content_type,
                  )
                  return normalize_uploaded_input_name(
                      payload,
                      expected_name=file_name,
                      expected_subfolder=normalized,
                  )
          '''
          runner = replace_once(runner, old_upload, new_upload, "client multipart compatibility")

          old_parser = '''    parser.add_argument("plan", type=Path)
              parser.add_argument("workflow", type=Path)
              parser.add_argument("--bindings", type=Path)
              parser.add_argument("--incoming", type=Path, required=True)
              parser.add_argument("--server", default="http://127.0.0.1:8188")
              parser.add_argument("--base-seed", type=int, default=230815)
              parser.add_argument("--timeout", type=float, default=900.0)
              reference_group = parser.add_mutually_exclusive_group()
              reference_group.add_argument("--reference-root", type=Path)
              reference_group.add_argument("--reference-zip", type=Path)
          '''
          new_parser = '''    parser.add_argument("plan", type=Path, nargs="?")
              parser.add_argument("workflow", type=Path, nargs="?")
              parser.add_argument("--plan", dest="plan_option", type=Path)
              parser.add_argument("--workflow", dest="workflow_option", type=Path)
              parser.add_argument("--bindings", type=Path)
              parser.add_argument("--incoming", type=Path, required=True)
              parser.add_argument("--server", default="http://127.0.0.1:8188")
              parser.add_argument("--base-seed", type=int, default=230815)
              parser.add_argument("--timeout", type=float, default=900.0)
              reference_group = parser.add_mutually_exclusive_group()
              reference_group.add_argument("--reference-dir", "--reference-root", dest="reference_dir", type=Path)
              reference_group.add_argument("--reference-zip", type=Path)
          '''
          runner = replace_once(runner, old_parser, new_parser, "CLI compatibility")

          old_main = '''def main(argv: list[str] | None = None) -> int:
              args = _build_parser().parse_args(argv)
              result = run_art_plan(
                  args.plan,
                  args.workflow,
                  args.bindings,
                  args.incoming,
                  server_url=args.server,
                  base_seed=args.base_seed,
                  prompt_timeout_seconds=args.timeout,
                  reference_root=args.reference_root,
                  reference_zip=args.reference_zip,
                  reference_subfolder=args.reference_subfolder,
                  stage=args.stage,
                  destination_root=args.destination,
              )
          '''
          new_main = '''def main(argv: list[str] | None = None) -> int:
              parser = _build_parser()
              args   = parser.parse_args(argv)
              plan   = args.plan_option or args.plan
              workflow = args.workflow_option or args.workflow
              if plan is None or workflow is None:
                  parser.error("plan and workflow are required")
              result = run_art_plan(
                  plan,
                  workflow,
                  args.bindings,
                  args.incoming,
                  server_url=args.server,
                  base_seed=args.base_seed,
                  prompt_timeout_seconds=args.timeout,
                  reference_root=args.reference_dir,
                  reference_zip=args.reference_zip,
                  reference_subfolder=args.reference_subfolder,
                  stage=args.stage,
                  destination_root=args.destination,
              )
          '''
          runner = replace_once(runner, old_main, new_main, "main CLI resolution")

          png = replace_once(
              png,
              '''        if is_upper and (fill_ratio > 0.80 or span_variance < 0.10):
          ''',
              '''        if is_upper and (
                      fill_ratio > 0.90 or (fill_ratio > 0.82 and span_variance < 0.05)
                  ):
          ''',
              "upper limb silhouette threshold",
          )

          runner_path.write_text(runner, encoding="utf-8")
          png_path.write_text(png, encoding="utf-8")
          PY

      - name: Run focused Maotai production contracts
        shell: bash
        run: |
          PYTHONPATH=.:src python -m pytest -q \
            tests/contract/test_maotai_v2_comfyui_autobind.py \
            tests/contract/test_maotai_v2_comfyui_reference_upload.py \
            tests/contract/test_maotai_v2_reference_zip.py \
            tests/contract/test_maotai_v2_comfyui_graph.py \
            tests/contract/test_maotai_v2_design_fidelity.py \
            tests/contract/test_maotai_v2_structural_quality.py

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "OpenAI Assistant"
          git config user.email "assistant@openai.local"
          git add \
            windows/desktop/tools/maotai_v2_assets/run_maotai_v2_comfyui_jobs.py \
            windows/desktop/tools/maotai_v2_assets/maotai_png_validation.py
          git diff --cached --check
          git commit -m "fix(maotai-v2): restore art runner contracts"
          git push origin HEAD:feature/maotai-natural-motion-v2
