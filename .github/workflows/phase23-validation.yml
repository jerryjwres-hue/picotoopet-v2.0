name: Phase 2.3 Control Center Validation

on:
  pull_request:
    branches:
      - main
      - feature/phase-2.3-control-center-design
      - feature/phase-2.3-slice-a-foundation
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "contracts/**"
      - ".github/workflows/phase23-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase23-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Python contract and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out PR head for one-time contract synchronization
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio pytest-cov ruff jsonschema

      - name: Export deterministic contracts
        shell: bash
        run: |
          PYTHONPATH=.:src python scripts/export_contracts.py

      - name: Commit generated OpenAPI only on the current same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- contracts/openapi/mac_core_v1.openapi.json; then
            echo "OpenAPI already synchronized."
            exit 0
          fi
          git config user.name "PicotooPet Contract CI"
          git config user.email "contract-ci@picotoopet.local"
          git add contracts/openapi/mac_core_v1.openapi.json
          git commit -m "docs: refresh Slice B OpenAPI"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Run capability and Worker contracts first
        shell: bash
        run: |
          PYTHONPATH=.:src pytest -q \
            tests/contract/test_phase23_capabilities_contract.py \
            tests/contract/test_phase23_worker_status_contract.py

      - name: Run Python regression suite
        shell: bash
        run: |
          PYTHONPATH=.:src pytest -q

      - name: Lint Phase 2.3 Python changes
        shell: bash
        run: |
          ruff check \
            src/picotoopet_core/api/contracts \
            src/picotoopet_core/api/routes/health.py \
            src/picotoopet_core/api/routes/workers.py \
            tests/contract/test_phase23_capabilities_contract.py \
            tests/contract/test_phase23_worker_status_contract.py \
            tests/contract/test_connector_contract_v1.py \
            tests/contract/test_handoff_contract_v1.py

      - name: Upload generated OpenAPI evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Phase23-SliceB-OpenAPI
          path: contracts/openapi/mac_core_v1.openapi.json
          if-no-files-found: error
          retention-days: 30
