name: Windows Control Center Slice D CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "contracts/release/project-goal-invariants.json"
      - "contracts/release/component-baselines.json"
      - "scripts/detect_component_impact.py"
      - ".github/workflows/windows-control-center-ci.yml"
      - "windows/desktop/**"
      - "tests/contract/**"
      - "tests/security/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      runner_target:
        description: "Native Windows runner label"
        required: true
        default: picotoopet-windows-release
        type: choice
        options:
          - picotoopet-windows-release
          - windows-2025

permissions:
  contents: read

concurrency:
  group: windows-control-center-slice-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Detect Windows impact
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - name: Check out source and verified baselines
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify affected components
        id: detect
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/detect_component_impact.py \
              --baselines contracts/release/component-baselines.json \
              --head "$HEAD_SHA" \
              --force windows \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/detect_component_impact.py \
              --baselines contracts/release/component-baselines.json \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped native work
        if: steps.detect.outputs.windows != 'true'
        shell: bash
        run: echo "Windows runtime is unchanged since the verified baseline; native WPF build is intentionally skipped."

  control-center:
    needs: impact
    if: needs.impact.outputs.windows == 'true'
    name: Native Windows WPF behavior gate
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target || 'windows-2025' }}
    timeout-minutes: 30
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked Python test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            pytest-cov==7.1.0 `
            ruff==0.16.1 `
            jsonschema==4.26.0 `
            PyYAML

      - name: Run contract and security tests
        shell: powershell
        run: |
          $env:PYTHONPATH = ".;src"
          python -m pytest -q tests/contract tests/security

      - name: Install exact .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Show native Windows environment
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          dotnet --info
          $PSVersionTable.PSVersion

      - name: Reproduce legacy Task Center binding failure
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Test-TaskCenterLegacyBindingRegression.ps1

      - name: Run ShellNavigationReconnectWpfSmokeTests and approval Results diagnostic WPF smoke
        shell: powershell
        run: |
          dotnet run `
            --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj `
            --configuration Release

      - name: Build WPF solution with warnings as errors
        shell: powershell
        run: |
          dotnet build windows/desktop/PicotooPet.Desktop.sln `
            --configuration Release `
            --nologo `
            -warnaserror

      - name: Run published Control Center self-test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path windows/desktop/artifacts -Force | Out-Null
          $output = dotnet run `
            --project windows/desktop/src/PicotooPet.Desktop/PicotooPet.Desktop.csproj `
            --configuration Release `
            -- `
            --self-test `
            --self-test-output windows/desktop/artifacts/control-center-self-test.json
          $output | Write-Host
          if ($output -notcontains "PHASE23_CONTROL_CENTER_SELF_TEST=PASS") {
            throw "Control Center self-test marker missing."
          }
          if ($output -notcontains "PHASE23_TASK_CENTER_SELF_TEST=PASS") {
            throw "Task Center self-test marker missing."
          }

      - name: Upload compact WPF evidence
        uses: actions/upload-artifact@v7
        with:
          name: PicotooPet-Windows-WPF-Evidence-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: windows/desktop/artifacts/control-center-self-test.json
