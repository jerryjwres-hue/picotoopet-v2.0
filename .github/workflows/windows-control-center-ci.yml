name: Windows Control Center Slice D CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "contracts/release/project-goal-invariants.json"
      - "scripts/stamp_windows_goal_integrity.py"
      - "scripts/verify_project_goal_integrity.py"
      - ".github/workflows/windows-control-center-ci.yml"
      - "windows/desktop/**"
      - "tests/contract/**"
      - "tests/security/**"
      - "tests/release/test_windows_prebuilt_delivery.py"
      - "tests/release/test_windows_analyzer_regressions.py"
      - "tests/release/test_windows_goal_integrity_release_contract.py"
      - "tests/release/test_windows_native_install_permission.py"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-control-center-slice-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-center:
    name: Native Windows Control Center Slice D gate
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      PICOTOO_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PICOTOO_SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked Python test dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . `
            pytest==9.1.1 `
            pytest-asyncio==1.4.0 `
            pytest-cov==7.1.0 `
            ruff==0.16.1 `
            jsonschema==4.26.0 `
            PyYAML

      - name: Run contract security release analyzer and goal-integrity tests
        shell: powershell
        run: |
          $env:PYTHONPATH = ".;src"
          python -m pytest -q `
            tests/contract `
            tests/security `
            tests/release/test_windows_prebuilt_delivery.py `
            tests/release/test_windows_analyzer_regressions.py `
            tests/release/test_windows_goal_integrity_release_contract.py `
            tests/release/test_windows_native_install_permission.py

      - name: Install exact .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/desktop/global.json

      - name: Show native Windows environment
        shell: powershell
        run: |
          [Environment]::OSVersion.VersionString
          dotnet --info
          $PSVersionTable.PSVersion

      - name: Run Core and Slice D diagnostic smoke executable
        shell: powershell
        run: |
          dotnet run `
            --project windows/desktop/tests/PicotooPet.Desktop.Core.SmokeTests/PicotooPet.Desktop.Core.SmokeTests.csproj `
            --configuration Release

      - name: Build WPF solution with warnings as errors
        shell: powershell
        run: |
          dotnet build windows/desktop/PicotooPet.Desktop.sln `
            --configuration Release `
            --nologo `
            -warnaserror

      - name: Run Control Center Task Center and diagnostic rendering self-test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path windows/desktop/artifacts -Force | Out-Null
          $output = dotnet run `
            --project windows/desktop/src/PicotooPet.Desktop/PicotooPet.Desktop.csproj `
            --configuration Release `
            -- `
            --self-test `
            --self-test-output windows/desktop/artifacts/control-center-self-test.json
          $output | Write-Host
          if ($output -notcontains "PHASE23_CONTROL_CENTER_SELF_TEST=PASS") {
            throw "Control Center self-test marker missing."
          }
          if ($output -notcontains "PHASE23_TASK_CENTER_SELF_TEST=PASS") {
            throw "Task Center self-test marker missing."
          }

      - name: Build prebuilt Slice D Windows package
        shell: pwsh
        run: |
          $head = $env:PICOTOO_SOURCE_HEAD_SHA
          if ([string]::IsNullOrWhiteSpace($head) -or $head.Length -lt 12) {
            throw "PICOTOO_SOURCE_HEAD_SHA 无效。"
          }
          $version = "2.3.0-slice-d-diagnostic-$env:GITHUB_RUN_NUMBER-$($head.Substring(0, 12))"
          .\windows\desktop\scripts\Build-Phase2WindowsRelease.ps1 `
            -OutputRoot "windows\desktop\artifacts\control-center-release" `
            -Version $version

      - name: Stamp and validate approved native WPF package
        shell: powershell
        run: |
          $releaseRoot = "windows/desktop/artifacts/control-center-release"
          python scripts/stamp_windows_goal_integrity.py --output-root $releaseRoot
          if ($LASTEXITCODE -ne 0) {
            throw "GOAL_INTEGRITY_VIOLATION: 无法加盖原生 WPF 目标合同。"
          }
          $packages = @(Get-ChildItem -LiteralPath $releaseRoot -Filter "PicotooPet-Phase2-Windows-Prebuilt-*.zip" -File)
          if ($packages.Count -ne 1) {
            throw "GOAL_INTEGRITY_VIOLATION: 原生包数量必须为 1，实际为 $($packages.Count)。"
          }
          python scripts/verify_project_goal_integrity.py $packages[0].FullName --report "$releaseRoot/goal-integrity-report.json"
          if ($LASTEXITCODE -ne 0) {
            throw "GOAL_INTEGRITY_VIOLATION: 实际 ZIP 改变了批准的 WPF 产品目标。"
          }

      - name: Verify package lifecycle on Windows PowerShell 5.1
        shell: pwsh
        run: |
          .\windows\desktop\scripts\Invoke-Phase2WindowsReleaseLifecycleGate.ps1 `
            -ReleaseRoot "windows\desktop\artifacts\control-center-release"

      - name: Upload Control Center Slice D package and evidence
        uses: actions/upload-artifact@v7
        with:
          name: windows-control-center-slice-d-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            windows/desktop/artifacts/control-center-release/*.zip
            windows/desktop/artifacts/control-center-release/*.sha256.txt
            windows/desktop/artifacts/control-center-release/windows-build-report.json
            windows/desktop/artifacts/control-center-release/goal-integrity-stamp-report.json
            windows/desktop/artifacts/control-center-release/goal-integrity-report.json
            windows/desktop/artifacts/control-center-release/fixture-evidence/**
            windows/desktop/artifacts/control-center-self-test.json
